name: Build and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Validate source and generated assets
        run: node scripts/check-content-integrity.mjs
      - name: Verify deployment image selection
        run: node --test tests/pages-image-assets.test.js
      - name: Prove runtime reconstruction from source
        run: node --test tests/runtime-asset-fresh-checkout.test.js
      - name: Build static payload from source
        run: node scripts/build-static-site.mjs --out .tmp/site
      - name: Verify all Borg registry and record byte identities
        run: node scripts/borg/verify-assembly-record-byte-identity.mjs --check
      # OPS-007 Pages handoff: the builder rejects payloads above
      # 1,000,000,000 uncompressed bytes; the uploaded copy expires in one day.
      - name: Upload Pages deployment artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .tmp/site
          retention-days: 1
  deploy:
    needs: build
    # Missing/false pauses deployment while builds and PR checks remain enabled.
    # PRs never deploy; only verified main builds may publish.
    if: vars.ARCHITRINO_PAGES_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require Actions publishing before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pages_build_type="$(gh api "repos/${GH_REPO}/pages" --jq .build_type)"
          if [ "$pages_build_type" != "workflow" ]; then
            echo "::error::Pages must use GitHub Actions before enabling deployment."
            exit 1
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy built site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
