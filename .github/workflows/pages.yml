name: Build Pages

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Measured 5m20s on PR #259 (2026-09-05); the bound catches a hung step
    # rather than waiting for the six-hour runner limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build-pages
