name: Build and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source and generated assets
        run: node scripts/check-content-integrity.mjs
      - name: Verify deployment image selection
        run: node --test tests/pages-image-assets.test.js
      - name: Prove runtime reconstruction from source
        run: node --test tests/runtime-asset-fresh-checkout.test.js
      - name: Build static payload from source
        run: node scripts/build-static-site.mjs --out .tmp/site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .tmp/site
          retention-days: 1
  deploy:
    needs: build
    # Missing/false pauses deployment while builds and PR checks remain enabled.
    # PRs never deploy; only verified main builds may publish.
    if: vars.ARCHITRINO_PAGES_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require Actions publishing before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pages_build_type="$(gh api "repos/${GH_REPO}/pages" --jq .build_type)"
          if [ "$pages_build_type" != "workflow" ]; then
            echo "::error::Pages must use GitHub Actions before enabling deployment."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - name: Deploy built site
        id: deployment
        uses: actions/deploy-pages@v4
