name: Build and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source and generated assets
        run: node scripts/check-content-integrity.mjs
      - name: Verify deployment image selection
        run: node --test tests/pages-image-assets.test.js
      - name: Prove reconstruction without retained runtime files
        run: node --test tests/runtime-asset-fresh-checkout.test.js
      - name: Build static payload from source
        run: node scripts/build-static-site.mjs --out .tmp/site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .tmp/site
          retention-days: 1
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy built site
        id: deployment
        uses: actions/deploy-pages@v4
