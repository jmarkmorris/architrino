name: Content Integrity

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-content:
    runs-on: ubuntu-latest
    # Measured 2m16s on PR #259 (2026-09-05); the bound catches a hung step
    # rather than waiting for the six-hour runner limit.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Audit locked production dependencies
        run: npm audit --package-lock-only --audit-level=moderate --omit=dev

      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install source inventory tool
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # OPS-022: the test sweep is opt-in (AAA_TEST_SWEEP=run) until promoted
      # and is not requested here; the pilot-process tests stall without
      # bound on this runner (PR #260, 2026-09-07).
      - name: Run Content Integrity gate
        run: node scripts/check-content-integrity.mjs --profile=github
