name: Content Integrity

on:
  push:
  pull_request:

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Content Integrity gate
        run: node scripts/check-content-integrity.mjs
