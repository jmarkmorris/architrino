name: Content Integrity

on:
  push:
  pull_request:

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate content indexes and references
        run: node scripts/validate-content.mjs --check --strict

      - name: Validate generated scene graph manifest
        run: node scripts/build-scene-graph.mjs --check --strict

      - name: Validate generated iOS textbook package
        run: node scripts/export-ios-textbook-package.mjs --check --strict

      - name: Smoke test manifest runtime routes/search
        run: node scripts/smoke-option3.mjs
