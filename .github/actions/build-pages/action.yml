name: Build Pages payload
description: Validate sources, reconstruct runtime assets, and upload the bounded Pages payload.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"
    - name: Install locked JavaScript dependencies
      shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund
    # Actions checks out authored sources without ignored runtime outputs.
    # Build once, verify that payload, then upload the same directory.
    - name: Build and check Pages payload
      shell: bash
      run: node scripts/check-pages-build.mjs --out .tmp/site
    # OPS-007 Pages handoff: the builder rejects payloads above
    # 1,000,000,000 uncompressed bytes; the uploaded copy expires in one day.
    - name: Upload Pages deployment artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: .tmp/site
        retention-days: 1
