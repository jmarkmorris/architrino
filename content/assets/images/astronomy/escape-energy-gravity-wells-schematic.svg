<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Escape-Energy Gravity Wells Schematic</title>
  <desc id="desc">A log-scaled project-owned schematic comparing equivalent escape-energy gravity well depths for the Moon, Mars, Earth, and Jupiter.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="0.54" stop-color="#15232b"/>
      <stop offset="1" stop-color="#0b141a"/>
    </linearGradient>
    <linearGradient id="wellMoon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8dee5"/>
      <stop offset="1" stop-color="#9aa6b2"/>
    </linearGradient>
    <linearGradient id="wellMars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5a27d"/>
      <stop offset="1" stop-color="#9b4c37"/>
    </linearGradient>
    <linearGradient id="wellEarth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ac7a0"/>
      <stop offset="1" stop-color="#236f8e"/>
    </linearGradient>
    <linearGradient id="wellJupiter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d1a8"/>
      <stop offset="1" stop-color="#b9814d"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#space)"/>
  <g opacity="0.42">
    <circle cx="170" cy="115" r="2" fill="#f3f7ff"/>
    <circle cx="302" cy="185" r="1.5" fill="#f3f7ff"/>
    <circle cx="468" cy="104" r="1.2" fill="#f3f7ff"/>
    <circle cx="784" cy="156" r="1.8" fill="#f3f7ff"/>
    <circle cx="1130" cy="95" r="1.4" fill="#f3f7ff"/>
    <circle cx="1416" cy="172" r="2.2" fill="#f3f7ff"/>
    <circle cx="1503" cy="294" r="1.2" fill="#f3f7ff"/>
    <circle cx="92" cy="350" r="1.6" fill="#f3f7ff"/>
    <circle cx="554" cy="322" r="1.2" fill="#f3f7ff"/>
    <circle cx="1324" cy="404" r="1.7" fill="#f3f7ff"/>
  </g>
  <text x="86" y="92" fill="#f5f7fa" font-family="Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="700">Escape-energy gravity wells</text>
  <text x="88" y="135" fill="#c8d3dc" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22">Equivalent height against Earth surface gravity, plotted on a log scale.</text>
  <text x="88" y="166" fill="#8fa2b1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18">Depth is computed as v_esc^2 / 2g_earth, so the diagram compares energy cost rather than literal distance.</text>
  <g transform="translate(120 238)" filter="url(#softShadow)">
    <rect x="0" y="0" width="1360" height="540" rx="0" fill="#f7fafc" opacity="0.94"/>
    <line x1="84" y1="424" x2="1278" y2="424" stroke="#283541" stroke-width="3"/>
    <line x1="84" y1="104" x2="84" y2="424" stroke="#283541" stroke-width="3"/>
    <g font-family="Inter, Helvetica, Arial, sans-serif" fill="#364653" font-size="17">
      <text x="24" y="429">100 km</text>
      <text x="24" y="349">1,000 km</text>
      <text x="18" y="269">10,000 km</text>
      <text x="6" y="189">100,000 km</text>
      <text x="6" y="109">1,000,000 km</text>
    </g>
    <g stroke="#b8c5cf" stroke-width="1">
      <line x1="84" y1="424" x2="1278" y2="424"/>
      <line x1="84" y1="344" x2="1278" y2="344"/>
      <line x1="84" y1="264" x2="1278" y2="264"/>
      <line x1="84" y1="184" x2="1278" y2="184"/>
      <line x1="84" y1="104" x2="1278" y2="104"/>
    </g>
    <g font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="middle">
      <path d="M186 424 C186 397 226 397 226 424 Z" fill="url(#wellMoon)" stroke="#556270" stroke-width="2"/>
      <rect x="186" y="376" width="40" height="48" fill="url(#wellMoon)" stroke="#556270" stroke-width="2"/>
      <circle cx="206" cy="373" r="20" fill="#d8dee5" stroke="#556270" stroke-width="2"/>
      <text x="206" y="474" fill="#27323a" font-size="26" font-weight="700">Moon</text>
      <text x="206" y="506" fill="#52606c" font-size="18">288 km</text>
      <path d="M450 424 C450 369 522 369 522 424 Z" fill="url(#wellMars)" stroke="#773927" stroke-width="2"/>
      <rect x="450" y="296" width="72" height="128" fill="url(#wellMars)" stroke="#773927" stroke-width="2"/>
      <circle cx="486" cy="292" r="36" fill="#d98562" stroke="#773927" stroke-width="2"/>
      <text x="486" y="474" fill="#27323a" font-size="26" font-weight="700">Mars</text>
      <text x="486" y="506" fill="#52606c" font-size="18">1,290 km</text>
      <path d="M724 424 C724 330 824 330 824 424 Z" fill="url(#wellEarth)" stroke="#20576b" stroke-width="2"/>
      <rect x="724" y="232" width="100" height="192" fill="url(#wellEarth)" stroke="#20576b" stroke-width="2"/>
      <circle cx="774" cy="227" r="50" fill="#4ba6b8" stroke="#20576b" stroke-width="2"/>
      <path d="M736 219 C760 190 800 200 817 230 C793 226 772 238 752 256 C748 240 744 229 736 219 Z" fill="#71c88e" opacity="0.9"/>
      <text x="774" y="474" fill="#27323a" font-size="26" font-weight="700">Earth</text>
      <text x="774" y="506" fill="#52606c" font-size="18">6,380 km</text>
      <path d="M1032 424 C1032 244 1206 244 1206 424 Z" fill="url(#wellJupiter)" stroke="#8a5d31" stroke-width="2"/>
      <rect x="1032" y="70" width="174" height="354" fill="url(#wellJupiter)" stroke="#8a5d31" stroke-width="2"/>
      <ellipse cx="1119" cy="68" rx="87" ry="54" fill="#ddb981" stroke="#8a5d31" stroke-width="2"/>
      <path d="M1032 100 H1206" stroke="#8a5d31" stroke-width="10" opacity="0.22"/>
      <path d="M1032 154 H1206" stroke="#fff3d6" stroke-width="12" opacity="0.35"/>
      <path d="M1032 224 H1206" stroke="#8a5d31" stroke-width="11" opacity="0.25"/>
      <path d="M1032 303 H1206" stroke="#fff3d6" stroke-width="12" opacity="0.35"/>
      <text x="1119" y="474" fill="#27323a" font-size="26" font-weight="700">Jupiter</text>
      <text x="1119" y="506" fill="#52606c" font-size="18">180,000 km</text>
    </g>
  </g>
  <text x="126" y="835" fill="#9fb1bf" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17">Project-owned schematic for comparing escape-energy depth; values rounded from standard escape velocities.</text>
</svg>
