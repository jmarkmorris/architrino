<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">Electromagnetic Spectrum From Long Radio Waves To The Planck Scale</title>
  <desc id="desc">Logarithmic electromagnetic spectrum diagram showing radio, microwave, infrared, visible, ultraviolet, X-ray, gamma ray, ultra-high-energy gamma, and hypothetical Planck-scale photon regions.</desc>
  <defs>
    <linearGradient id="visibleGradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7b1fa2"/>
      <stop offset="0.16" stop-color="#283593"/>
      <stop offset="0.32" stop-color="#1565c0"/>
      <stop offset="0.48" stop-color="#00897b"/>
      <stop offset="0.64" stop-color="#fdd835"/>
      <stop offset="0.80" stop-color="#fb8c00"/>
      <stop offset="1" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="axisGradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#4a6fa5"/>
      <stop offset="0.22" stop-color="#3aa7a3"/>
      <stop offset="0.36" stop-color="#d8b44a"/>
      <stop offset="0.50" stop-color="#d75445"/>
      <stop offset="0.70" stop-color="#7d4ac7"/>
      <stop offset="1" stop-color="#20273a"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b1020" flood-opacity="0.22"/>
    </filter>
    <style>
      .page { fill: #f7f8fb; }
      .title { fill: #111827; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 44px; font-weight: 760; }
      .subtitle { fill: #4b5563; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 22px; }
      .axis-label { fill: #1f2937; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 22px; font-weight: 700; }
      .tick { stroke: #374151; stroke-width: 2; }
      .minor { stroke: #cfd5df; stroke-width: 1; }
      .tick-label { fill: #374151; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 18px; }
      .region-label { fill: #111827; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 22px; font-weight: 740; }
      .region-note { fill: #374151; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; }
      .callout { fill: #111827; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 19px; font-weight: 650; }
      .small { fill: #4b5563; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; }
      .panel { fill: #ffffff; stroke: #d9dee8; stroke-width: 1.5; }
      .rule { stroke: #6b7280; stroke-width: 2; stroke-dasharray: 5 6; }
      .arrow { stroke: #1f2937; stroke-width: 3; marker-end: url(#arrowHead); fill: none; }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#1f2937"/>
    </marker>
  </defs>

  <rect class="page" x="0" y="0" width="1800" height="1050"/>

  <text class="title" x="90" y="82">Electromagnetic Spectrum</text>
  <text class="subtitle" x="90" y="120">Wavelength decreases left to right; frequency and photon energy increase left to right.</text>

  <g transform="translate(0,0)">
    <rect class="panel" x="86" y="164" width="1628" height="616" rx="18" filter="url(#softShadow)"/>

    <text class="axis-label" x="120" y="214">long wavelength / low frequency</text>
    <text class="axis-label" x="1328" y="214">short wavelength / high frequency</text>
    <path class="arrow" d="M455 206 H1304"/>

    <rect x="120" y="294" width="1560" height="104" rx="16" fill="url(#axisGradient)"/>

    <g opacity="0.95">
      <rect x="120" y="294" width="145" height="104" rx="16" fill="#6c8fc7" opacity="0.92"/>
      <rect x="265" y="294" width="145" height="104" fill="#4a83c0" opacity="0.92"/>
      <rect x="410" y="294" width="109" height="104" fill="#3aa7a3" opacity="0.92"/>
      <rect x="519" y="294" width="114" height="104" fill="#d1a83c" opacity="0.92"/>
      <rect x="633" y="294" width="9" height="104" fill="url(#visibleGradient)"/>
      <rect x="642" y="294" width="95" height="104" fill="#a066c6" opacity="0.92"/>
      <rect x="737" y="294" width="109" height="104" fill="#8065d8" opacity="0.92"/>
      <rect x="846" y="294" width="290" height="104" fill="#5c4fb5" opacity="0.92"/>
      <rect x="1136" y="294" width="290" height="104" fill="#2f365f" opacity="0.92"/>
      <rect x="1426" y="294" width="254" height="104" rx="16" fill="#171b2b" opacity="0.92"/>
    </g>

    <g>
      <text class="region-label" x="192" y="334" text-anchor="middle">ELF / ULF</text>
      <text class="region-note" x="192" y="362" text-anchor="middle">long radio</text>

      <text class="region-label" x="338" y="334" text-anchor="middle">Radio</text>
      <text class="region-note" x="338" y="362" text-anchor="middle">broadcast to shortwave</text>

      <text class="region-label" x="465" y="334" text-anchor="middle">Microwave</text>
      <text class="region-note" x="465" y="362" text-anchor="middle">radar, CMB bands</text>

      <text class="region-label" x="576" y="334" text-anchor="middle">Infrared</text>
      <text class="region-note" x="576" y="362" text-anchor="middle">thermal light</text>

      <text class="region-label" x="690" y="334" text-anchor="middle">UV</text>
      <text class="region-note" x="690" y="362" text-anchor="middle">ionizing edge</text>

      <text class="region-label" x="792" y="334" text-anchor="middle">X-ray</text>
      <text class="region-note" x="792" y="362" text-anchor="middle">atomic inner shells</text>

      <text class="region-label" x="991" y="334" text-anchor="middle">Gamma ray</text>
      <text class="region-note" x="991" y="362" text-anchor="middle">nuclear and particle scale</text>

      <text class="region-label" x="1281" y="334" text-anchor="middle">Ultra-high-energy gamma</text>
      <text class="region-note" x="1281" y="362" text-anchor="middle">cosmic-ray frontier</text>

      <text class="region-label" x="1553" y="334" text-anchor="middle">Quantum-gravity scale</text>
      <text class="region-note" x="1553" y="362" text-anchor="middle">hypothetical photons</text>
    </g>

    <g>
      <line class="minor" x1="120" y1="260" x2="120" y2="438"/>
      <line class="minor" x1="265" y1="260" x2="265" y2="438"/>
      <line class="minor" x1="410" y1="260" x2="410" y2="438"/>
      <line class="minor" x1="519" y1="260" x2="519" y2="438"/>
      <line class="minor" x1="628" y1="260" x2="628" y2="438"/>
      <line class="minor" x1="737" y1="260" x2="737" y2="438"/>
      <line class="minor" x1="846" y1="260" x2="846" y2="438"/>
      <line class="minor" x1="955" y1="260" x2="955" y2="438"/>
      <line class="minor" x1="1136" y1="260" x2="1136" y2="438"/>
      <line class="minor" x1="1426" y1="260" x2="1426" y2="438"/>
      <line class="minor" x1="1672" y1="260" x2="1672" y2="438"/>
    </g>

    <g>
      <text class="axis-label" x="120" y="468">Wavelength</text>
      <line class="tick" x1="120" y1="484" x2="1680" y2="484"/>

      <g text-anchor="middle">
        <line class="tick" x1="120" y1="474" x2="120" y2="494"/>
        <text class="tick-label" x="120" y="523">10^8 m</text>
        <line class="tick" x1="265" y1="474" x2="265" y2="494"/>
        <text class="tick-label" x="265" y="523">10^4 m</text>
        <line class="tick" x1="410" y1="474" x2="410" y2="494"/>
        <text class="tick-label" x="410" y="523">1 m</text>
        <line class="tick" x1="519" y1="474" x2="519" y2="494"/>
        <text class="tick-label" x="519" y="523">1 mm</text>
        <line class="tick" x1="628" y1="474" x2="628" y2="494"/>
        <text class="tick-label" x="628" y="523">1 um</text>
        <line class="tick" x1="737" y1="474" x2="737" y2="494"/>
        <text class="tick-label" x="737" y="523">1 nm</text>
        <line class="tick" x1="846" y1="474" x2="846" y2="494"/>
        <text class="tick-label" x="846" y="523">1 pm</text>
        <line class="tick" x1="955" y1="474" x2="955" y2="494"/>
        <text class="tick-label" x="955" y="523">1 fm</text>
        <line class="tick" x1="1136" y1="474" x2="1136" y2="494"/>
        <text class="tick-label" x="1136" y="523">10^-20 m</text>
        <line class="tick" x1="1426" y1="474" x2="1426" y2="494"/>
        <text class="tick-label" x="1426" y="523">10^-28 m</text>
        <line class="tick" x1="1672" y1="474" x2="1672" y2="494"/>
        <text class="tick-label" x="1672" y="523">l_P</text>
      </g>
    </g>

    <g>
      <text class="axis-label" x="120" y="594">Frequency</text>
      <line class="tick" x1="120" y1="610" x2="1680" y2="610"/>

      <g text-anchor="middle">
        <line class="tick" x1="120" y1="600" x2="120" y2="620"/>
        <text class="tick-label" x="120" y="649">3 Hz</text>
        <line class="tick" x1="410" y1="600" x2="410" y2="620"/>
        <text class="tick-label" x="410" y="649">300 MHz</text>
        <line class="tick" x1="519" y1="600" x2="519" y2="620"/>
        <text class="tick-label" x="519" y="649">300 GHz</text>
        <line class="tick" x1="628" y1="600" x2="628" y2="620"/>
        <text class="tick-label" x="628" y="649">300 THz</text>
        <line class="tick" x1="737" y1="600" x2="737" y2="620"/>
        <text class="tick-label" x="737" y="649">3e17 Hz</text>
        <line class="tick" x1="846" y1="600" x2="846" y2="620"/>
        <text class="tick-label" x="846" y="649">3e20 Hz</text>
        <line class="tick" x1="955" y1="600" x2="955" y2="620"/>
        <text class="tick-label" x="955" y="649">3e23 Hz</text>
        <line class="tick" x1="1136" y1="600" x2="1136" y2="620"/>
        <text class="tick-label" x="1136" y="649">3e28 Hz</text>
        <line class="tick" x1="1426" y1="600" x2="1426" y2="620"/>
        <text class="tick-label" x="1426" y="649">3e36 Hz</text>
        <line class="tick" x1="1672" y1="600" x2="1672" y2="620"/>
        <text class="tick-label" x="1672" y="649">1.9e43 Hz</text>
      </g>
    </g>

    <g>
      <line class="rule" x1="633" y1="294" x2="710" y2="718"/>
      <line class="rule" x1="642" y1="294" x2="1090" y2="718"/>
      <rect class="panel" x="706" y="690" width="680" height="66" rx="18"/>
      <rect x="730" y="713" width="190" height="20" rx="10" fill="url(#visibleGradient)"/>
      <text class="callout" x="942" y="729">visible light: about 700 nm to 400 nm</text>
    </g>

    <g>
      <line class="rule" x1="1672" y1="248" x2="1672" y2="706"/>
      <text class="callout" x="1326" y="704">Planck length marker: l_P = 1.616e-35 m</text>
      <text class="small" x="1326" y="730">A Planck-scale photon is a hypothesis marker, not an observed radiation band.</text>
    </g>
  </g>

  <g>
    <rect class="panel" x="86" y="822" width="1628" height="138" rx="18"/>
    <text class="callout" x="120" y="867">Reading notes</text>
    <text class="small" x="120" y="900">Band boundaries are conventional and overlap in practice. The X-ray/gamma distinction is often source-based as well as energy-based.</text>
    <text class="small" x="120" y="929">The far-left range represents very long measured radio-wave regimes; the far-right range is an extrapolated quantum-gravity scale.</text>
  </g>
</svg>
