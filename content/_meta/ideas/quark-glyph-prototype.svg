<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 980" role="img" aria-labelledby="title desc">
  <title id="title">Compact Quark Glyph Prototype</title>
  <desc id="desc">Prototype board for compact binary personality glyphs and whole-quark color chips using purple orbit structure and red/blue architrino dots.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10172a"/>
      <stop offset="100%" stop-color="#090d18"/>
    </linearGradient>
    <linearGradient id="chipFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="chipSelected" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <filter id="glowPurple" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#9b5cff" flood-opacity="0.32"/>
    </filter>
    <filter id="glowBlue" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#1b84ff" flood-opacity="0.38"/>
    </filter>
    <filter id="glowRed" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff3d4a" flood-opacity="0.34"/>
    </filter>
    <filter id="chipSelectedGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#000000" flood-opacity="0.26"/>
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <g id="baseBinaryGlyph">
      <ellipse cx="0" cy="0" rx="60" ry="16" fill="none" stroke="#a259ff" stroke-width="3" filter="url(#glowPurple)"/>
      <line x1="0" y1="-60" x2="0" y2="60" stroke="#a259ff" stroke-width="2.05" stroke-linecap="round" opacity="0.78"/>
      <circle cx="-60" cy="0" r="9" fill="#1879ff" filter="url(#glowBlue)"/>
      <circle cx="60" cy="0" r="9" fill="#ff3d3d" filter="url(#glowRed)"/>
    </g>
    <g id="personality-ee">
      <use href="#baseBinaryGlyph"/>
      <circle cx="0" cy="-60" r="8.2" fill="#1879ff" filter="url(#glowBlue)"/>
      <circle cx="0" cy="60" r="8.2" fill="#1879ff" filter="url(#glowBlue)"/>
    </g>
    <g id="personality-pe">
      <use href="#baseBinaryGlyph"/>
      <circle cx="0" cy="-60" r="8.2" fill="#ff3d3d" filter="url(#glowRed)"/>
      <circle cx="0" cy="60" r="8.2" fill="#1879ff" filter="url(#glowBlue)"/>
    </g>
    <g id="personality-pp">
      <use href="#baseBinaryGlyph"/>
      <circle cx="0" cy="-60" r="8.2" fill="#ff3d3d" filter="url(#glowRed)"/>
      <circle cx="0" cy="60" r="8.2" fill="#ff3d3d" filter="url(#glowRed)"/>
    </g>
    <g id="personality-ep">
      <use href="#baseBinaryGlyph"/>
      <circle cx="0" cy="-60" r="8.2" fill="#1879ff" filter="url(#glowBlue)"/>
      <circle cx="0" cy="60" r="8.2" fill="#ff3d3d" filter="url(#glowRed)"/>
    </g>
  </defs>

  <rect width="1480" height="980" fill="url(#bg)"/>

  <text x="80" y="82" fill="#f4f7ff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">
    Compact Reaction Glyph Study
  </text>
  <text x="80" y="116" fill="#a7b5d7" font-family="Inter, Arial, sans-serif" font-size="16">
    Purple structure = orbit + axis. Red / blue spheres = architrino polarity. Chip frame = whole-quark color.
  </text>

  <text x="80" y="190" fill="#f4f7ff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">
    Canonical Compact Binary Personality Set
  </text>
  <text x="80" y="220" fill="#98a8cb" font-family="Inter, Arial, sans-serif" font-size="15">
    Reduced set uses e/e, p/e, p/p. The neutral representative is p/e: positrino above, electrino below.
  </text>

  <g transform="translate(90 270)">
    <rect x="0" y="0" width="250" height="176" rx="10" fill="url(#chipFill)" stroke="#3c8dff" stroke-width="3" filter="url(#shadow)"/>
    <text x="24" y="28" fill="#d8e0f7" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.4">
      &#x03B5;<tspan baseline-shift="super" font-size="10">-</tspan> / &#x03B5;<tspan baseline-shift="super" font-size="10">-</tspan>
    </text>
    <g transform="translate(125 92)">
      <use href="#personality-ee"/>
    </g>
  </g>

  <g transform="translate(375 270)">
    <rect x="0" y="0" width="250" height="176" rx="10" fill="url(#chipSelected)" stroke="#b889ff" stroke-width="3" filter="url(#chipSelectedGlow)"/>
    <text x="24" y="28" fill="#f4f0ff" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.4">
      &#x03B5;<tspan baseline-shift="super" font-size="10">+</tspan> / &#x03B5;<tspan baseline-shift="super" font-size="10">-</tspan>
    </text>
    <g transform="translate(125 92)">
      <use href="#personality-pe"/>
    </g>
  </g>

  <g transform="translate(660 270)">
    <rect x="0" y="0" width="250" height="176" rx="10" fill="url(#chipFill)" stroke="#ff5561" stroke-width="3" filter="url(#shadow)"/>
    <text x="24" y="28" fill="#d8e0f7" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.4">
      &#x03B5;<tspan baseline-shift="super" font-size="10">+</tspan> / &#x03B5;<tspan baseline-shift="super" font-size="10">+</tspan>
    </text>
    <g transform="translate(125 92)">
      <use href="#personality-pp"/>
    </g>
  </g>

  <g transform="translate(930 270)">
    <rect x="0" y="0" width="470" height="210" rx="30" fill="#000000" stroke="#2e3953" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="28" y="34" fill="#f4f7ff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Full four-state vocabulary when needed</text>
    <g transform="translate(58 104)">
      <g transform="scale(0.72)">
        <use href="#personality-ee"/>
      </g>
    </g>
    <g transform="translate(172 104)">
      <g transform="scale(0.72)">
        <use href="#personality-pe"/>
      </g>
    </g>
    <g transform="translate(286 104)" opacity="0.72">
      <g transform="scale(0.72)">
        <use href="#personality-ep"/>
      </g>
    </g>
    <g transform="translate(400 104)">
      <g transform="scale(0.72)">
        <use href="#personality-pp"/>
      </g>
    </g>
    <text x="58" y="186" text-anchor="middle" fill="#f4f7ff" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.2">
      &#x03B5;<tspan baseline-shift="super" font-size="9">-</tspan>/&#x03B5;<tspan baseline-shift="super" font-size="9">-</tspan>
    </text>
    <text x="172" y="186" text-anchor="middle" fill="#f4f7ff" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.2">
      &#x03B5;<tspan baseline-shift="super" font-size="9">+</tspan>/&#x03B5;<tspan baseline-shift="super" font-size="9">-</tspan>
    </text>
    <text x="286" y="186" text-anchor="middle" fill="#f4f7ff" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.2">
      &#x03B5;<tspan baseline-shift="super" font-size="9">-</tspan>/&#x03B5;<tspan baseline-shift="super" font-size="9">+</tspan>
    </text>
    <text x="400" y="186" text-anchor="middle" fill="#f4f7ff" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.2">
      &#x03B5;<tspan baseline-shift="super" font-size="9">+</tspan>/&#x03B5;<tspan baseline-shift="super" font-size="9">+</tspan>
    </text>
  </g>

  <text x="80" y="588" fill="#f4f7ff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">
    Whole-Quark Color at the Chip Level
  </text>
  <text x="80" y="618" fill="#98a8cb" font-family="Inter, Arial, sans-serif" font-size="15">
    Quark color lives in the outer chip accent: Red, Purple, Blue. Internal binary dots stay semantically red / blue.
  </text>

  <g transform="translate(90 668)">
    <rect x="0" y="0" width="190" height="176" rx="10" fill="url(#chipFill)" stroke="#ff5561" stroke-width="3" filter="url(#shadow)"/>
    <text x="20" y="28" fill="#ffb1b7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">UP RED</text>
    <g transform="translate(95 104)">
      <use href="#personality-pe"/>
    </g>
  </g>

  <g transform="translate(310 668)">
    <rect x="0" y="0" width="190" height="176" rx="10" fill="url(#chipSelected)" stroke="#b889ff" stroke-width="3" filter="url(#chipSelectedGlow)"/>
    <text x="20" y="28" fill="#e0ccff" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">UP PURPLE</text>
    <g transform="translate(95 104)">
      <use href="#personality-pe"/>
    </g>
  </g>

  <g transform="translate(530 668)">
    <rect x="0" y="0" width="190" height="176" rx="10" fill="url(#chipFill)" stroke="#3c8dff" stroke-width="3" filter="url(#shadow)"/>
    <text x="20" y="28" fill="#b8d7ff" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">UP BLUE</text>
    <g transform="translate(95 104)">
      <use href="#personality-pe"/>
    </g>
  </g>

  <g transform="translate(800 668)">
    <rect x="0" y="0" width="190" height="176" rx="10" fill="url(#chipFill)" stroke="#ff5561" stroke-width="3" filter="url(#shadow)"/>
    <text x="20" y="28" fill="#ffb1b7" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">DOWN RED</text>
    <g transform="translate(95 104)">
      <use href="#personality-pe"/>
    </g>
  </g>

  <g transform="translate(1020 668)">
    <rect x="0" y="0" width="190" height="176" rx="10" fill="url(#chipFill)" stroke="#b889ff" stroke-width="3" filter="url(#shadow)"/>
    <text x="20" y="28" fill="#e0ccff" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">DOWN PURPLE</text>
    <g transform="translate(95 104)">
      <use href="#personality-pe"/>
    </g>
  </g>

  <g transform="translate(1240 668)">
    <rect x="0" y="0" width="190" height="176" rx="10" fill="url(#chipFill)" stroke="#3c8dff" stroke-width="3" filter="url(#shadow)"/>
    <text x="20" y="28" fill="#b8d7ff" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">DOWN BLUE</text>
    <g transform="translate(95 104)">
      <use href="#personality-pe"/>
    </g>
  </g>

  <text x="1400" y="944" text-anchor="end" fill="#7485a8" font-family="Inter, Arial, sans-serif" font-size="13">
    Prototype study only. Selection fill indicates UI state, not semantic quark color.
  </text>
</svg>
