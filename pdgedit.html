<!doctype html>
<html lang="en" style="background:#0b0e1a;color:#f5f7ff;">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e1a" />
    <title>pdgedit</title>
    <link rel="stylesheet" href="./src/runtime/top-dynamic-control-bar.css" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0e1a;
        color: #f5f7ff;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }

      #pdgedit-app {
        position: relative;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at top, rgba(36, 48, 86, 0.45), transparent 42%),
          linear-gradient(180deg, rgba(11, 14, 26, 0.98), rgba(5, 8, 18, 1));
      }

      .pdgedit-top-band {
        position: relative;
        width: 100%;
        height: 80px;
      }

      .pdgedit-top-band-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        padding: 16px max(244px, calc(env(safe-area-inset-right) + 244px)) 16px 16px;
      }

      .pdgedit-top-heading {
        min-width: 0;
        flex: 1 1 auto;
      }

      #pdgedit-document-title {
        min-height: 32px;
        color: #f5f7ff;
        font-size: 22px;
        font-weight: 650;
        line-height: 1.2;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .pdgedit-top-tools {
        position: fixed;
        top: max(60px, calc(env(safe-area-inset-top) + 48px));
        right: max(16px, env(safe-area-inset-right));
        z-index: 10;
        display: inline-flex;
        align-items: flex-start;
        gap: 8px;
      }

      .pdgedit-top-tools[hidden] {
        display: none;
      }

      .pdgedit-navigation.top-dynamic-control-bar.is-standalone {
        position: fixed;
      }

      .pdgedit-top-band-summary {
        padding: 0 16px 16px;
      }

      #pdgedit-reaction-summary {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 48px;
        padding: 12px 14px;
        border: 1px solid rgba(160, 170, 220, 0.18);
        border-radius: 14px;
        background: rgba(8, 10, 18, 0.48);
        color: rgba(245, 247, 255, 0.88);
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: thin;
      }

      #pdgedit-reaction-summary[hidden] {
        display: none;
      }

      .pdgedit-reaction-summary-line {
        display: inline-flex;
        align-items: baseline;
        min-width: max-content;
        margin: 0;
        color: inherit;
        font-size: 13px;
        font-weight: 500;
        line-height: 1.4;
        white-space: nowrap;
      }

      .pdgedit-reaction-side {
        display: inline-flex;
        align-items: baseline;
      }

      .pdgedit-reaction-participant {
        display: inline-block;
      }

      .pdgedit-reaction-label {
        display: inline;
      }

      .pdgedit-reaction-group {
        display: inline-block;
      }

      .pdgedit-reaction-bracket {
        color: rgba(245, 247, 255, 0.82);
      }

      .pdgedit-reaction-provenance {
        display: inline-block;
        margin-left: 3px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(177, 197, 255, 0.9);
        position: relative;
        top: -0.48em;
        line-height: 1;
      }

      .pdgedit-reaction-separator {
        display: inline-block;
        margin: 0 8px;
        color: rgba(245, 247, 255, 0.72);
      }

      .pdgedit-reaction-arrow {
        margin: 0 12px;
        color: rgba(245, 247, 255, 0.72);
      }

      #pdgedit-document-trigger {
        min-height: 32px;
        border: 1px solid rgba(160, 170, 220, 0.25);
        background: rgba(8, 10, 18, 0.75);
        color: #f5f7ff;
        backdrop-filter: blur(6px);
      }

      #pdgedit-document-trigger {
        min-width: 260px;
        max-width: min(80vw, 420px);
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        padding: 0 14px;
        font-size: 13px;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #pdgedit-document-trigger:hover,
      #pdgedit-document-trigger:focus-visible {
        border-color: rgba(213, 220, 255, 0.6);
      }

      #pdgedit-document-trigger:disabled {
        opacity: 0.45;
        cursor: default;
      }

      #pdgedit-document-panel,
      #pdgedit-create-picker {
        position: absolute;
        min-width: 260px;
        max-width: min(80vw, 360px);
        border: 1px solid rgba(160, 170, 220, 0.25);
        border-radius: 12px;
        background: rgba(8, 10, 18, 0.75);
        padding: 8px 10px;
        backdrop-filter: blur(6px);
        z-index: 12;
      }

      #pdgedit-document-panel {
        top: 44px;
        right: 0;
        display: flex;
        flex-direction: column;
        max-height: min(calc(100vh - 72px), 80vh);
        max-height: min(calc(100dvh - 72px), 80dvh);
        overflow: hidden;
        overscroll-behavior: contain;
        touch-action: pan-y;
      }

      #pdgedit-document-panel[hidden],
      #pdgedit-create-picker[hidden] {
        display: none;
      }

      .pdgedit-document-option,
      .pdgedit-create-option,
      .pdgedit-operator-type-button,
      .pdgedit-create-confirm {
        width: 100%;
        border: 1px solid rgba(160, 170, 220, 0.2);
        border-radius: 10px;
        background: transparent;
        color: #f5f7ff;
        text-align: left;
        cursor: pointer;
        font: inherit;
      }

      .pdgedit-document-option,
      .pdgedit-create-option {
        padding: 9px 10px;
      }

      .pdgedit-document-option {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .pdgedit-document-option-label {
        min-width: 0;
        flex: 1 1 auto;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .pdgedit-document-option-probability {
        flex: 0 0 auto;
        font-variant-numeric: tabular-nums;
        color: rgba(177, 197, 255, 0.9);
      }

      .pdgedit-document-option + .pdgedit-document-option,
      .pdgedit-create-option + .pdgedit-create-option {
        margin-top: 6px;
      }

      #pdgedit-document-search {
        display: block;
        width: 100%;
        min-height: 34px;
        margin: 0 0 8px;
        border: 1px solid rgba(160, 170, 220, 0.2);
        border-radius: 10px;
        background: rgba(12, 16, 28, 0.92);
        color: #f5f7ff;
        padding: 0 10px;
        font: inherit;
      }

      #pdgedit-document-search::placeholder {
        color: rgba(245, 247, 255, 0.48);
      }

      #pdgedit-document-source-filter {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        margin: 0 0 8px;
      }

      .pdgedit-document-source-filter-button {
        min-height: 34px;
        border: 1px solid rgba(160, 170, 220, 0.2);
        border-radius: 10px;
        background: rgba(12, 16, 28, 0.92);
        color: rgba(245, 247, 255, 0.78);
        padding: 0 10px;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .pdgedit-document-source-filter-button.is-selected {
        border-color: rgba(213, 220, 255, 0.55);
        background: rgba(255, 255, 255, 0.08);
        color: #f5f7ff;
      }

      .pdgedit-document-empty {
        padding: 10px;
        color: rgba(245, 247, 255, 0.68);
        font-size: 13px;
      }

      .pdgedit-document-option-list {
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }

      .pdgedit-document-option.is-selected,
      .pdgedit-operator-type-button.is-selected {
        border-color: rgba(213, 220, 255, 0.55);
        background: rgba(255, 255, 255, 0.08);
      }

      #pdgedit-surface-region {
        position: absolute;
        inset: 160px 0 0;
        overflow-y: auto;
        overflow-x: auto;
      }

      .pdgedit-strip-wrap {
        width: 100%;
        min-width: 1600px;
        min-height: 100%;
        display: flex;
        justify-content: center;
        padding: 0 0 48px;
      }

      #pdgedit-surface-strip {
        position: relative;
        flex: 0 0 1600px;
        width: 1600px;
        min-height: 160px;
      }

      #pdgedit-object-layer,
      #pdgedit-balance-layer,
      #pdgedit-composite-layer,
      #pdgedit-link-overlay {
        position: absolute;
        inset: 0;
      }

      #pdgedit-object-layer {
        z-index: 4;
      }

      #pdgedit-link-overlay {
        z-index: 3;
        overflow: visible;
        pointer-events: none;
      }

      #pdgedit-balance-layer {
        z-index: 6;
        pointer-events: none;
      }

      #pdgedit-composite-layer {
        z-index: 5;
        pointer-events: none;
      }

      .pdgedit-balance-badge {
        position: absolute;
        top: 18px;
        transform: translateX(-50%);
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(8, 10, 18, 0.78);
        color: rgba(245, 247, 255, 0.82);
        font-size: 11.75px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0;
        white-space: nowrap;
        display: inline-flex;
        align-items: baseline;
        gap: 8px;
      }

      .pdgedit-balance-term {
        display: inline-flex;
        align-items: baseline;
        gap: 3px;
      }

      .pdgedit-balance-term.is-negative {
        color: #2d8cff;
      }

      .pdgedit-balance-term.is-positive {
        color: #ff5a4a;
      }

      .pdgedit-balance-label,
      .pdgedit-balance-count {
        color: inherit;
      }

      .pdgedit-balance-label {
        display: inline-block;
      }

      .pdgedit-balance-epsilon {
        color: inherit;
      }

      .pdgedit-balance-sign {
        color: inherit;
        vertical-align: super;
        line-height: 0;
      }

      .pdgedit-balance-separator {
        color: rgba(245, 247, 255, 0.62);
      }

      .pdgedit-object {
        position: absolute;
        display: inline-flex;
        align-items: stretch;
        gap: 0;
        padding: 0;
        margin: 0;
        border: none;
        background: transparent;
        cursor: pointer;
      }

      .pdgedit-object:focus-visible {
        outline: none;
      }

      .pdgedit-object.is-selected::after,
      .pdgedit-object.is-link-pending::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        border-radius: 6px;
      }

      .pdgedit-object.is-selected::after {
        border: 1px solid rgba(245, 247, 255, 0.82);
      }

      .pdgedit-object.is-link-pending::after {
        border: 1px dashed rgba(245, 247, 255, 0.82);
      }

      .pdgedit-link-hit-target {
        pointer-events: stroke;
      }

      .pdgedit-surface-tile,
      .pdgedit-missing-tile {
        flex: 0 0 80px;
        width: 80px;
        height: 80px;
      }

      .pdgedit-missing-tile {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px;
        border: 1px solid rgba(245, 247, 255, 0.18);
        background: #000;
        color: #f5f7ff;
        font-size: 11px;
        text-align: center;
      }

      .pdgedit-composite-label {
        position: absolute;
        width: 80px;
        overflow: visible;
      }

      .pdgedit-composite-line {
        position: absolute;
        width: 1px;
        background: rgba(245, 247, 255, 0.7);
        pointer-events: none;
      }

      .pdgedit-composite-tile {
        position: absolute;
        top: 50%;
        left: 0;
        transform: translateY(-50%);
      }

      .pdgedit-create-list {
        max-height: min(60vh, 480px);
        overflow: auto;
      }

      .pdgedit-count-fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 8px;
      }

      .pdgedit-count-field input {
        width: 100%;
        min-height: 34px;
        padding: 0 10px;
        border-radius: 10px;
        border: 1px solid rgba(160, 170, 220, 0.25);
        background: rgba(255, 255, 255, 0.04);
        color: #f5f7ff;
        font: inherit;
      }

      .pdgedit-operator-type-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }

      .pdgedit-operator-type-button {
        min-height: 34px;
        padding: 0 8px;
        text-align: center;
      }

      .pdgedit-create-confirm {
        margin-top: 8px;
        min-height: 36px;
        padding: 0 10px;
        text-align: center;
      }

      .pdgedit-create-confirm:disabled {
        opacity: 0.45;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="scene-hud-tools" class="pdgedit-navigation"></div>
    <div id="pdgedit-app">
      <div class="pdgedit-top-band pdgedit-top-band-header">
        <div class="pdgedit-top-heading">
          <div id="pdgedit-document-title">No reaction selected</div>
        </div>
        <div class="pdgedit-top-tools">
          <button id="pdgedit-document-trigger" type="button" aria-label="Choose pdgedit document">
            Choose pdgedit document
          </button>
          <div id="pdgedit-document-panel" role="listbox" aria-hidden="true" hidden>
            <input
              id="pdgedit-document-search"
              type="search"
              placeholder="Search reactions"
              aria-label="Search available reactions"
              autocomplete="off"
              spellcheck="false"
            />
            <div id="pdgedit-document-source-filter" role="group" aria-label="Filter reactions">
              <button
                type="button"
                class="pdgedit-document-source-filter-button is-selected"
                data-source-filter="all"
                aria-pressed="true"
              >
                All
              </button>
              <button
                type="button"
                class="pdgedit-document-source-filter-button"
                data-source-filter="exact-zero-residue"
                aria-pressed="false"
              >
                Exact 0:0
              </button>
              <button
                type="button"
                class="pdgedit-document-source-filter-button"
                data-source-filter="probability"
                aria-pressed="false"
              >
                Probability
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="pdgedit-top-band pdgedit-top-band-summary">
        <div id="pdgedit-reaction-summary" aria-hidden="true" hidden></div>
      </div>
      <div id="pdgedit-surface-region">
        <div class="pdgedit-strip-wrap">
          <div id="pdgedit-surface-strip">
            <div id="pdgedit-object-layer"></div>
            <svg id="pdgedit-link-overlay" aria-hidden="true"></svg>
            <div id="pdgedit-composite-layer"></div>
            <div id="pdgedit-balance-layer" aria-hidden="true"></div>
          </div>
        </div>
        <div id="pdgedit-create-picker" aria-hidden="true" hidden></div>
      </div>
    </div>
    <script type="module" src="./src/apps/pdgedit/main.js"></script>
  </body>
</html>
