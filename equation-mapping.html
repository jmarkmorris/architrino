<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4b0082" />
    <title>Equation Mapping</title>
    <link
      rel="stylesheet"
      href="./apps/ios/ArchitrinoReader/ArchitrinoReader/ReaderAssets/katex/katex.min.css"
    />
    <link rel="stylesheet" href="./src/runtime/top-dynamic-control-bar.css" />
    <script defer src="./apps/ios/ArchitrinoReader/ArchitrinoReader/ReaderAssets/katex/katex.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #4b0082;
        color: #ffffff;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      #equation-mapping-app {
        width: 100%;
        height: 100%;
      }

      .equation-mapping-shell {
        --index-width: 276px;
        --reference-width: 340px;
        /* Both rails take space from the canvas, so the equation and every
           panel sized against the canvas must subtract both. */
        --rail-width: calc(var(--index-width) + var(--reference-width));
        /* Clears the single canonical control bar, which sits at
           top: max(16px, safe-area-top) and is 32px tall. */
        --panel-top: max(56px, calc(env(safe-area-inset-top) + 40px));
        --panel-right: max(16px, env(safe-area-inset-right));
        --equation-ink: #4b0082;
        --line-ink: #4b0082;
        --marker-ink: rgba(75, 0, 130, 0.44);
        --text: var(--equation-ink);
        --muted: var(--equation-ink);
        --rule: rgba(75, 0, 130, 0.18);
        --strong-rule: rgba(75, 0, 130, 0.42);
        --panel: rgba(255, 255, 255, 0.88);
        --panel-strong: rgba(255, 255, 255, 0.96);
        --accent: var(--equation-ink);
        --accent-soft: rgba(75, 0, 130, 0.12);
        display: grid;
        grid-template-columns: var(--index-width) minmax(0, 1fr) var(--reference-width);
        width: 100%;
        height: 100%;
        background: var(--equation-mapping-background, #fdfdfd);
        color: var(--text);
      }

      .equation-mapping-shell[data-background="architrinoPurple"] {
        --equation-ink: #ffffff;
        --line-ink: #ffffff;
        --marker-ink: rgba(232, 226, 236, 0.58);
        --text: var(--equation-ink);
        --muted: var(--equation-ink);
        --rule: rgba(255, 255, 255, 0.22);
        --strong-rule: rgba(255, 255, 255, 0.46);
        --panel: rgba(22, 10, 32, 0.76);
        --panel-strong: rgb(22, 10, 32);
        --accent: var(--equation-ink);
        --accent-soft: rgba(255, 255, 255, 0.14);
      }

      .equation-mapping-shell[data-background="warm"] {
        --equation-ink: #4b0082;
        --line-ink: #4b0082;
        --marker-ink: rgba(75, 0, 130, 0.44);
        --text: var(--equation-ink);
        --muted: var(--equation-ink);
        --rule: rgba(75, 0, 130, 0.18);
        --strong-rule: rgba(75, 0, 130, 0.42);
        --panel: rgba(255, 250, 239, 0.88);
        --panel-strong: rgba(255, 250, 239, 0.97);
        --accent: var(--equation-ink);
        --accent-soft: rgba(75, 0, 130, 0.12);
      }

      .equation-mapping-shell[data-background="dark"] {
        --equation-ink: #ffffff;
        --line-ink: #ffffff;
        --marker-ink: rgba(226, 232, 240, 0.58);
        --text: var(--equation-ink);
        --muted: var(--equation-ink);
        --rule: rgba(255, 255, 255, 0.2);
        --strong-rule: rgba(255, 255, 255, 0.46);
        --panel: rgba(15, 23, 42, 0.78);
        --panel-strong: rgb(15, 23, 42);
        --accent: var(--equation-ink);
        --accent-soft: rgba(255, 255, 255, 0.14);
      }

      .equation-mapping-shell[data-index-collapsed="true"] {
        --index-width: 72px;
      }

      .equation-mapping-shell[data-reference-collapsed="true"] {
        --reference-width: 72px;
      }

      .equation-mapping-index {
        position: relative;
        display: flex;
        flex-direction: column;
        z-index: 3;
        min-width: 0;
        min-height: 0;
        height: 100dvh;
        overflow: hidden;
        border-right: 1px solid var(--rule);
        background: var(--panel);
      }

      .equation-mapping-index-header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 66px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--rule);
      }

      .equation-mapping-index-header strong {
        flex: 1;
        font-size: 22px;
        line-height: 1;
      }

      .equation-mapping-shell[data-index-collapsed="true"] .equation-mapping-index-header:has(.equation-mapping-return-link) {
        flex-direction: column;
        gap: 12px;
        padding-top: 18px;
      }

      .equation-mapping-shell[data-index-collapsed="true"] .equation-mapping-index-header strong,
      .equation-mapping-shell[data-index-collapsed="true"] .equation-mapping-index-body,
      .equation-mapping-index-body[hidden] {
        display: none;
      }

      .equation-mapping-index-body {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
        padding: 12px 12px 0;
      }

      .equation-mapping-index-body > :not(.equation-mapping-index-groups) {
        flex-shrink: 0;
      }

      .equation-mapping-index-views {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px;
        padding: 3px;
        border: 1px solid var(--rule);
        border-radius: 7px;
      }

      .equation-mapping-index-views button,
      .equation-mapping-index-more {
        min-height: 34px;
        padding: 5px 7px;
        border: 1px solid transparent;
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        font: 600 12px/1.25 Helvetica, Arial, sans-serif;
        cursor: pointer;
      }

      .equation-mapping-index-views button[aria-pressed="true"],
      .equation-mapping-index-more {
        background: var(--accent-soft);
        border-color: var(--rule);
      }

      .equation-mapping-index-views button:focus-visible,
      .equation-mapping-index-more:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      .equation-mapping-index-status {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .equation-mapping-index-groups {
        display: grid;
        align-content: start;
        gap: 6px;
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
        padding: 0 0 12px;
      }

      .equation-mapping-index-group {
        display: grid;
        gap: 4px;
      }

      .equation-mapping-index-group-toggle {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 36px;
        padding: 7px 8px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        text-align: left;
      }

      .equation-mapping-index-group-toggle:hover,
      .equation-mapping-index-group-toggle:focus-visible {
        border-color: var(--strong-rule);
        outline: none;
      }

      .equation-mapping-index-group-toggle strong {
        overflow-wrap: anywhere;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.3;
      }

      .equation-mapping-index-group-toggle small {
        color: var(--muted);
        font-size: 12px;
        font-weight: 400;
      }

      .equation-mapping-index-group-chevron {
        font-size: 22px;
        line-height: 1;
        transition: transform 140ms ease;
      }

      .equation-mapping-index-group[data-expanded="true"] > .equation-mapping-index-group-toggle > .equation-mapping-index-group-chevron {
        transform: rotate(90deg);
      }

      .equation-mapping-index-group[data-expanded="false"] > .equation-mapping-index-items {
        display: none;
      }

      .equation-mapping-index-items {
        display: grid;
        gap: 2px;
        margin-left: 9px;
        padding-left: 5px;
        border-left: 1px solid var(--rule);
      }

      .equation-mapping-index-item {
        display: grid;
        gap: 6px;
        width: 100%;
        min-height: 36px;
        padding: 8px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        text-align: left;
      }

      .equation-mapping-index-item > span {
        overflow-wrap: anywhere;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.35;
      }

      .equation-mapping-index-item small {
        color: var(--muted);
        overflow-wrap: anywhere;
        font-size: 12px;
        font-weight: 400;
        line-height: 1.35;
      }

      .equation-mapping-index-pinned {
        border-color: var(--rule);
        background: var(--accent-soft);
      }

      .equation-mapping-index-pinned > span {
        font-weight: 600;
      }

      .equation-mapping-index-item.is-active,
      .equation-mapping-index-item:hover,
      .equation-mapping-index-item:focus-visible {
        border-color: var(--strong-rule);
        background: var(--accent-soft);
        outline: none;
      }

      .equation-mapping-canvas {
        position: relative;
        min-width: 0;
        min-height: 0;
      }

      .equation-mapping-stage {
        position: relative;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
      }

      .equation-mapping-stage::after {
        content: "";
        position: absolute;
        top: var(--equation-content-height, 100%);
        width: 1px;
        height: 1px;
        pointer-events: none;
      }

      /* Anchored to the viewport, not to the canvas column, so the panel stays
         under the control that opens it however wide the rails are. */
      .equation-mapping-panel-layer {
        position: fixed;
        top: var(--panel-top);
        right: var(--panel-right);
        z-index: 12;
      }

      .equation-mapping-panel-layer[hidden] {
        display: none;
      }

      .equation-mapping-carousel {
        position: absolute;
        bottom: max(16px, env(safe-area-inset-bottom));
        left: 50%;
        z-index: 4;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 6px;
        border: 1px solid var(--rule);
        border-radius: 999px;
        background: var(--panel);
        box-shadow: 0 14px 28px rgba(0, 0, 0, 0.2);
        transform: translateX(-50%);
        pointer-events: none;
      }

      .equation-mapping-carousel[hidden] {
        display: none;
      }

      .equation-mapping-carousel-button {
        -webkit-appearance: none;
        appearance: none;
        display: inline-flex;
        width: 44px;
        height: 38px;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 1px solid var(--rule);
        border-radius: 999px;
        background: var(--panel-strong);
        color: var(--line-ink);
        cursor: pointer;
        opacity: 0.9;
        pointer-events: auto;
      }

      .equation-mapping-carousel-button:hover,
      .equation-mapping-carousel-button:focus-visible {
        border-color: var(--strong-rule);
        background: var(--accent-soft);
        color: var(--line-ink);
        opacity: 1;
        outline: none;
      }

      .equation-mapping-carousel-button:disabled {
        cursor: default;
        opacity: 0.18;
      }

      .equation-mapping-carousel-button:disabled:hover {
        border-color: var(--rule);
        background: var(--panel-strong);
      }

      .equation-mapping-carousel-button svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        pointer-events: none;
      }

      .equation-mapping-icon-button {
        display: inline-grid;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 1px solid var(--rule);
        border-radius: 6px;
        background: var(--panel-strong);
        color: var(--text);
        cursor: pointer;
      }

      .equation-mapping-icon-button:hover,
      .equation-mapping-icon-button:focus-visible,
      .equation-mapping-icon-button.is-active {
        border-color: var(--strong-rule);
        color: var(--text);
        outline: none;
      }

      .equation-mapping-icon-button svg {
        width: 18px;
        height: 18px;
      }

      .equation-mapping-return-link {
        flex: 0 0 32px;
        width: 32px;
        height: 32px;
        border-radius: 999px;
        text-decoration: none;
      }

      .equation-mapping-return-link svg {
        width: 16px;
        height: 16px;
      }

      .equation-mapping-return-link:hover,
      .equation-mapping-return-link:focus-visible {
        border-color: var(--strong-rule);
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }

      .equation-mapping-popover {
        width: min(340px, calc(100vw - 30px));
        border: 1px solid var(--rule);
        border-radius: 8px;
        background: var(--panel-strong);
        box-shadow: 0 18px 34px rgba(0, 0, 0, 0.16);
      }

      .equation-mapping-settings-panel {
        display: grid;
        grid-template-columns: minmax(92px, auto) minmax(0, 1fr);
        align-items: center;
        gap: 4px 12px;
        padding: 10px;
      }

      .equation-mapping-search-input {
        width: 100%;
        height: 34px;
        padding: 0 10px;
        border: 1px solid var(--rule);
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        outline: none;
      }

      .equation-mapping-search-input:focus {
        border-color: var(--strong-rule);
      }

      .equation-mapping-empty {
        color: var(--muted);
        font-size: 12px;
      }

      /* The label column is intrinsic, not a fixed 92px track, and it is owned
         by the panel rather than by each row so all three labels still align.
         A fixed track overlaps its neighbour as soon as the rendered text is
         wider than the track, and a single word such as "Background" cannot
         avoid that by wrapping, so any browser or platform text-size floor
         pushed it across the swatches. An intrinsic column widens instead. */
      .equation-mapping-settings-row {
        display: contents;
      }

      .equation-mapping-settings-label {
        display: flex;
        align-items: center;
        min-height: 38px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 720;
      }

      .equation-mapping-swatches,
      .equation-mapping-segmented {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        min-height: 38px;
        gap: 6px;
      }

      .equation-mapping-swatch {
        width: 26px;
        height: 26px;
        border: 1px solid var(--rule);
        border-radius: 50%;
        cursor: pointer;
      }

      .equation-mapping-swatch.is-active {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-soft);
      }

      .equation-mapping-segment {
        min-width: 54px;
        height: 28px;
        padding: 0 8px;
        border: 1px solid var(--rule);
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font-size: 11px;
      }

      .equation-mapping-segment.is-active {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .equation-mapping-equation-shell {
        position: absolute;
        top: var(--equation-layout-y, 50%);
        left: 50%;
        z-index: 4;
        width: min(96vw, 1320px);
        max-width: calc(100vw - var(--rail-width) - 24px);
        transform: translate(-50%, -50%);
      }

      .equation-mapping-stage[data-document-id="eq-00-coordinate-layer-key"] .equation-mapping-equation-shell {
        width: min(96vw, 1600px);
      }

      .equation-mapping-stage[data-document-id="eq-00-coordinate-layer-key"] .equation-mapping-formula-part[data-anchor-id="effectiveLayer"] {
        transform: translateX(clamp(96px, 10vw, 180px));
      }

      .equation-mapping-stage[data-document-id="eq-00-coordinate-layer-key"] .equation-mapping-formula-break[data-part-id="comparison-layer-break"] {
        height: clamp(56px, 5vw, 88px);
      }

      /* The right inset must clear the top control strip, whose width depends
         on how many controls the page contributes. The runtime measures the
         strip and publishes --control-strip-clearance; the clamp is the floor
         used before that measurement lands. */
      .equation-mapping-equation-title {
        position: absolute;
        top: max(22px, env(safe-area-inset-top));
        right: max(clamp(116px, 16vw, 204px), var(--control-strip-clearance, 0px));
        left: clamp(116px, 16vw, 204px);
        z-index: 4;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 7px 10px;
        padding: 0 8px;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.18;
        text-align: center;
        pointer-events: none;
      }

      .equation-mapping-equation-title strong {
        color: var(--text);
        font-size: 22px;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .equation-mapping-equation {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: center;
        max-width: 100%;
        color: var(--text);
        font-size: var(--equation-fit-font-size, clamp(30px, 4.6vw, 62px));
        line-height: 1.25;
        text-align: center;
      }

      .equation-mapping-symbol-strip {
        position: relative;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        width: min(100%, 980px);
        margin: 18px auto 0;
      }

      .equation-mapping-symbol-chip {
        position: relative;
        display: inline-flex;
        min-width: 34px;
        min-height: 30px;
        align-items: center;
        justify-content: center;
        padding: 3px 9px;
        border: 1px solid var(--rule);
        border-radius: 999px;
        background: var(--panel-strong);
        color: var(--text);
        cursor: pointer;
        font-size: 16px;
      }

      .equation-mapping-symbol-chip:hover,
      .equation-mapping-symbol-chip:focus-visible,
      .equation-mapping-symbol-chip.is-active {
        border-color: var(--strong-rule);
        background: var(--accent-soft);
        outline: none;
      }

      .equation-mapping-symbol-tooltip {
        position: absolute;
        z-index: 12;
        width: max-content;
        max-width: min(320px, calc(100vw - 32px));
        padding: 7px 9px;
        border: 1px solid var(--strong-rule);
        border-radius: 6px;
        background: var(--panel-strong);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 11px;
        font-weight: 500;
        line-height: 1.35;
        text-align: left;
        white-space: normal;
      }

      .equation-mapping-symbol-tooltip[hidden] {
        display: none;
      }

      /* Keep the hover target continuous across the gap above/below a chip. */
      .equation-mapping-symbol-tooltip::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: -8px;
        height: 8px;
      }

      .equation-mapping-symbol-tooltip[data-placement="above"]::before {
        top: 100%;
      }

      .equation-mapping-symbol-empty {
        color: var(--muted);
        font-size: 12px;
      }

      /* Mirrors .equation-mapping-index on the opposite edge: a grid column
         that collapses to icon width rather than a panel floating over the
         canvas, so the equation always re-centres in the space that is left.

         It starts below the top control strip. The strip is positioned against
         the viewport's top-right, which is this rail's corner, so a rail run to
         the top would put its own surface behind the strip's buttons. Hanging
         the rail under the strip keeps the strip on the canvas, where it sits
         on every other page, instead of moving shared chrome for one app. */
      .equation-mapping-reference {
        position: relative;
        display: flex;
        flex-direction: column;
        z-index: 3;
        min-width: 0;
        min-height: 0;
        margin-top: var(--panel-top);
        height: calc(100dvh - var(--panel-top));
        overflow: hidden;
        border-left: 1px solid var(--rule);
        border-top: 1px solid var(--rule);
        background: var(--panel);
        color: var(--text);
      }

      .equation-mapping-reference-header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 66px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--rule);
      }

      .equation-mapping-reference-header strong {
        flex: 1;
        font-size: 16px;
        line-height: 1.2;
      }

      .equation-mapping-shell[data-reference-collapsed="true"] .equation-mapping-reference-header {
        justify-content: center;
        padding: 12px 0;
      }

      .equation-mapping-shell[data-reference-collapsed="true"] .equation-mapping-reference-header strong,
      .equation-mapping-shell[data-reference-collapsed="true"] .equation-mapping-reference-body,
      .equation-mapping-reference-body[hidden] {
        display: none;
      }

      .equation-mapping-reference-body {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
        padding: 14px;
      }

      .equation-mapping-reference-section + .equation-mapping-reference-section {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--rule);
      }

      .equation-mapping-reference-section h2 {
        margin: 0 0 8px;
        font-size: 14px;
      }

      .equation-mapping-source-link {
        color: var(--text);
        font-weight: 720;
      }

      .equation-mapping-source-path,
      .equation-mapping-symbol-definition small {
        color: var(--muted);
        font-size: 11px;
        overflow-wrap: anywhere;
      }

      .equation-mapping-source-excerpt,
      .equation-mapping-symbol-definition p {
        margin: 8px 0 0;
        font-size: 13px;
        line-height: 1.48;
      }

      .equation-mapping-symbol-definition {
        display: grid;
        grid-template-columns: minmax(44px, auto) minmax(0, 1fr);
        gap: 2px 10px;
        margin-top: 8px;
        padding: 9px;
        border: 1px solid var(--rule);
        border-radius: 7px;
      }

      .equation-mapping-symbol-definition.is-active {
        border-color: var(--strong-rule);
        background: var(--accent-soft);
      }

      .equation-mapping-symbol-definition-tex {
        grid-row: 1 / span 2;
        align-self: start;
        font-size: 18px;
      }

      .equation-mapping-symbol-definition p {
        margin: 0;
      }

      .equation-mapping-shell[data-equation-scale="small"] .equation-mapping-equation {
        font-size: var(--equation-fit-font-size, clamp(24px, 3.7vw, 52px));
      }

      .equation-mapping-shell[data-equation-scale="large"] .equation-mapping-equation {
        font-size: var(--equation-fit-font-size, clamp(36px, 5.6vw, 76px));
      }

      .equation-mapping-formula-part,
      .equation-mapping-formula-text {
        position: relative;
        display: inline-block;
        flex: 0 0 auto;
        padding: 10px 2px;
        white-space: nowrap;
      }

      .equation-mapping-formula-text {
        white-space: pre;
      }

      .equation-mapping-formula-break {
        flex: 0 0 100%;
        width: 100%;
        height: clamp(28px, 3.2vw, 52px);
      }

      .equation-mapping-formula-part.is-targeted[data-section-line="above"]::before,
      .equation-mapping-formula-part.is-targeted[data-section-line="below"]::after {
        position: absolute;
        left: var(--section-marker-left, max(8px, 18%));
        right: var(--section-marker-right, max(8px, 18%));
        width: var(--section-marker-width, auto);
        height: 1px;
        background: var(--marker-ink);
        content: "";
      }

      .equation-mapping-formula-part.is-targeted[data-section-line="above"]::before {
        top: -16px;
      }

      .equation-mapping-formula-part.is-targeted[data-section-line="below"]::after {
        bottom: -14px;
      }

      .equation-mapping-overlay-layer {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }

      .equation-mapping-comment {
        position: absolute;
        left: var(--overlay-layout-x, calc(var(--overlay-x) * 1%));
        top: var(--overlay-layout-y, calc(var(--overlay-y) * 1%));
        width: min(calc(var(--overlay-width) * 1%), var(--overlay-max-width, 429px));
        min-width: 220px;
        padding: 10px;
        border: 1px solid var(--line-ink);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        pointer-events: auto;
        cursor: pointer;
      }

      .equation-mapping-comment.is-active {
        border-color: var(--line-ink);
      }

      .equation-mapping-comment-header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }

      .equation-mapping-comment-header strong {
        flex: 0 1 auto;
        font-size: 21px;
      }

      .equation-mapping-comment-target {
        flex: 0 0 auto;
        max-width: 100%;
        margin-left: auto;
        color: var(--text);
        font-size: 21px;
        line-height: 1.1;
        text-align: right;
        white-space: nowrap;
      }

      .equation-mapping-comment-body {
        display: grid;
        gap: 6px;
        color: var(--text);
        font-size: 21px;
        line-height: 1.35;
      }

      .equation-mapping-comment-body p {
        margin: 0;
      }

      .equation-mapping-shell[data-comment-font-size="small"] .equation-mapping-comment-header strong,
      .equation-mapping-shell[data-comment-font-size="small"] .equation-mapping-comment-target,
      .equation-mapping-shell[data-comment-font-size="small"] .equation-mapping-comment-body {
        font-size: 18px;
      }

      .equation-mapping-shell[data-comment-font-size="large"] .equation-mapping-comment-header strong,
      .equation-mapping-shell[data-comment-font-size="large"] .equation-mapping-comment-target,
      .equation-mapping-shell[data-comment-font-size="large"] .equation-mapping-comment-body {
        font-size: 24px;
      }

      .equation-mapping-comment-math {
        color: var(--text);
      }

      .equation-mapping-pointer-layer {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }

      .equation-mapping-pointer-line {
        stroke: var(--marker-ink);
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
      }

      .equation-mapping-math-fallback {
        font-family: "Times New Roman", Times, serif;
      }

      @media (max-width: 760px) {
        html,
        body {
          height: auto;
          min-height: 100%;
          overflow: auto;
        }

        #equation-mapping-app {
          height: auto;
          min-height: 100%;
        }

        /* Neither rail is a column here, so neither reserves canvas width. */
        .equation-mapping-shell {
          --index-width: 0px;
          --reference-width: 0px;
          display: block;
          height: auto;
          min-height: 100%;
        }

        .equation-mapping-index {
          position: absolute;
          left: 0;
          top: 0;
          width: min(82vw, 280px);
          height: 100dvh;
          transform: translateX(0);
        }

        .equation-mapping-shell[data-index-collapsed="true"] .equation-mapping-index {
          width: 72px;
        }

        .equation-mapping-reference {
          position: absolute;
          right: 0;
          top: var(--panel-top);
          margin-top: 0;
          width: min(82vw, 320px);
          height: calc(100dvh - var(--panel-top));
          border-left: 1px solid var(--rule);
        }

        .equation-mapping-shell[data-reference-collapsed="true"] .equation-mapping-reference {
          width: 72px;
        }

        .equation-mapping-canvas,
        .equation-mapping-stage {
          height: auto;
          min-height: 100vh;
        }

        .equation-mapping-canvas {
          overflow: visible;
        }

        .equation-mapping-stage {
          display: grid;
          align-content: start;
          gap: 18px;
          overflow: visible;
          padding: 132px 15px 88px;
        }

        .equation-mapping-stage::after {
          display: none;
        }

        /* Both rails overlay the canvas here. An expanded rail covers content
           by design, but a collapsed strip is always on screen, so keep the
           equation clear of whichever strips are showing. */
        .equation-mapping-shell[data-index-collapsed="true"] .equation-mapping-stage {
          padding-left: 87px;
        }

        .equation-mapping-shell[data-reference-collapsed="true"] .equation-mapping-stage {
          padding-right: 87px;
        }

        .equation-mapping-carousel {
          bottom: max(12px, env(safe-area-inset-bottom));
          gap: 8px;
          padding: 5px;
        }

        .equation-mapping-carousel-button {
          width: 42px;
          height: 42px;
        }

        .equation-mapping-carousel-button svg {
          width: 23px;
          height: 23px;
          stroke-width: 2.3;
        }

        .equation-mapping-pointer-layer {
          display: none;
        }

        /* Sized against the stage's content box rather than the viewport, so
           the stage padding that clears the collapsed rails is respected. */
        .equation-mapping-equation-shell {
          position: static;
          transform: none;
          width: min(100%, 760px);
          margin: 0 auto;
        }

        .equation-mapping-equation-title {
          position: static;
          margin-bottom: 10px;
        }

        .equation-mapping-equation-title strong {
          flex-basis: 100%;
        }

        .equation-mapping-overlay-layer {
          position: static;
          display: grid;
          gap: 12px;
          width: min(100%, 300px);
          margin: 0 auto;
          margin-top: var(--symbol-tooltip-clearance, 0px);
          pointer-events: auto;
        }

        .equation-mapping-comment {
          position: static;
          width: 100%;
          min-width: 0;
        }

        .equation-mapping-stage[data-document-id="eq-00-coordinate-layer-key"] .equation-mapping-formula-part[data-anchor-id="effectiveLayer"] {
          transform: none;
        }

        .equation-mapping-popover {
          width: min(320px, calc(100vw - 30px));
        }
      }
    </style>
  </head>
  <body>
    <div id="scene-hud-tools" class="equation-mapping-navigation"></div>
    <div id="equation-mapping-app"></div>
    <script type="module" src="./src/apps/equation-mapping/main.js"></script>
  </body>
</html>
