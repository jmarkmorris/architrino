<!doctype html>
<html lang="en" style="background:#0b0e1a;color:#f5f7ff;">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0e1a" />
    <title>architrino legacy reaction archive</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #0b0e1a;
        color: #f5f7ff;
      }
    </style>
    <link rel="stylesheet" href="../../style.css" />
  </head>
  <body class="reaction-app-page" style="background:#0b0e1a;color:#f5f7ff;">
    <div class="reaction-app-shell">
      <header class="reaction-app-header">
        <div class="reaction-app-title-row">
          <h1 class="reaction-app-title">Legacy Reaction Designer</h1>
          <div class="reaction-app-actions">
            <a
              class="reaction-app-home-link"
              href="../../index.html"
              aria-label="Go to home"
              title="Go to home"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M3 11.5L12 4l9 7.5M6.5 10.5V20h11V10.5"
                  stroke="currentColor"
                  stroke-width="2"
                  fill="none"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
            </a>
            <div id="reaction-library-picker" class="reaction-app-library-picker">
              <span class="reaction-app-library-label">Library</span>
              <button
                id="reaction-library-trigger"
                class="reaction-app-library-trigger"
                type="button"
                aria-label="Choose a reaction library entry"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-controls="reaction-library-menu"
              ></button>
              <div
                id="reaction-library-menu"
                class="reaction-app-library-menu"
                role="listbox"
                aria-label="Reaction library entries"
                hidden
              ></div>
            </div>
            <button
              id="reaction-accept-button"
              class="reaction-app-action is-primary"
              type="button"
              aria-label="Accept the current reaction for handoff"
            >
              Accept
            </button>
            <button
              id="reaction-export-button"
              class="reaction-app-action"
              type="button"
              aria-label="Export accepted reaction-flow JSON"
            >
              Export JSON
            </button>
            <button
              id="reaction-clear-button"
              class="reaction-app-action"
              type="button"
              aria-label="Clear the reaction canvas"
            >
              Clear
            </button>
            <button
              id="reaction-solve-button"
              class="reaction-app-action"
              type="button"
              aria-label="Run reaction solve"
            >
              Solve
            </button>
          </div>
        </div>
        <div id="reaction-review-state" class="reaction-app-review-state" aria-live="polite"></div>
        <div id="reaction-status" class="reaction-app-status" aria-live="polite"></div>
        <div id="reaction-hint" class="reaction-app-hint" aria-live="polite"></div>
        <section
          id="reaction-legibility-panel"
          class="reaction-app-legibility"
          aria-label="Reaction workflow grammar and visible surface state"
        ></section>
      </header>
      <main class="reaction-app-main">
        <section
          id="reaction-canvas"
          class="composer-reaction-canvas"
          aria-hidden="false"
          tabindex="0"
        >
          <div
            id="reaction-canvas-surface"
            class="composer-reaction-canvas-surface"
          >
            <svg
              id="reaction-canvas-svg"
              class="composer-reaction-canvas-svg"
              aria-hidden="true"
            ></svg>
            <div
              id="reaction-canvas-empty"
              class="composer-reaction-canvas-empty"
              aria-hidden="false"
            >
              Use the + controls to start building a reaction.
            </div>
            <div
              id="reaction-canvas-reactants"
              class="composer-reaction-canvas-column is-reactants"
            ></div>
            <div
              class="composer-reaction-canvas-column-group-slot is-operator-left"
              data-operator-lane-index="0"
              aria-hidden="true"
            ></div>
            <div class="composer-reaction-canvas-operator-layer" aria-hidden="false"></div>
            <div
              class="composer-reaction-canvas-column-group-slot is-operator-right"
              data-operator-lane-index="1"
              aria-hidden="true"
            ></div>
            <div
              id="reaction-canvas-products"
              class="composer-reaction-canvas-column is-products"
            ></div>
          </div>
          <div
            id="reaction-canvas-menu"
            class="composer-reaction-canvas-menu"
            hidden
            aria-hidden="true"
          ></div>
        </section>
      </main>
    </div>
    <script>
      window.addEventListener("error", (event) => {
        const message = String(event?.message || "").trim();
        const status = document.getElementById("reaction-status");
        if (status) {
          status.textContent = `Reaction runtime error: ${message}`;
        }
      });
      window.addEventListener("unhandledrejection", (event) => {
        const status = document.getElementById("reaction-status");
        const reason = event?.reason;
        const message =
          (typeof reason === "object" && reason && "message" in reason ? reason.message : reason) ?? "";
        if (status) {
          status.textContent = `Reaction runtime error: ${String(message || "Unhandled promise rejection").trim()}`;
        }
      });
    </script>
    <script type="module" src="./src/apps/reaction/main.js?v=2026-04-06-reaction-app-v14"></script>
  </body>
</html>
