<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="title desc">
  <title id="title">Positive W boson tile</title>
  <desc id="desc">Positive W boson tile. Xyzzy text tile with a black 80 by 80 outer tile and a centered 72 by 72 bordered square.</desc>
  <rect width="80" height="80" fill="#000000"/>
  <rect x="6" y="6" width="68" height="68" rx="10" fill="none" stroke="#ff5a4a" stroke-width="4"/>
  <text x="40" y="32.00" fill="#f5f7ff" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.75" font-weight="700" text-anchor="middle">Positive</text>
  <text x="40" y="44.00" fill="#f5f7ff" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.75" font-weight="700" text-anchor="middle">W</text>
  <text x="40" y="56.00" fill="#f5f7ff" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.75" font-weight="700" text-anchor="middle">Boson</text>
</svg>