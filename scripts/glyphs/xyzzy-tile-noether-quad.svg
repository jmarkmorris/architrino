<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="title desc">
  <title id="title">Noether Quad tile</title>
  <desc id="desc">Noether Quad tile. Xyzzy text tile with a black 80 by 80 outer tile and a centered 72 by 72 bordered square.</desc>
  <rect width="80" height="80" fill="#000000"/>
  <rect x="6" y="6" width="68" height="68" rx="10" fill="none" stroke="#a259ff" stroke-width="4"/>
  <text x="40" y="31.00" fill="#f5f7ff" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.75" font-weight="700" text-anchor="middle">Noether</text>
  <text x="40" y="44.00" fill="#f5f7ff" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.75" font-weight="700" text-anchor="middle">Quad</text>
  <text x="40" y="57.00" fill="#f5f7ff" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.75" font-weight="700" text-anchor="middle">Two Pair</text>
</svg>