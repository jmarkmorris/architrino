<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="title desc">
  <title id="title">Pass Thru operator tile</title>
  <desc id="desc">Pass Thru operator tile. Xyzzy text tile with a black 80 by 80 outer tile and a centered 72 by 72 bordered square.</desc>
  <rect width="80" height="80" fill="#000000"/>
  <rect x="6" y="6" width="68" height="68" rx="10" fill="none" stroke="#a259ff" stroke-width="4"/>
  <text x="40" y="28.00" fill="#ff3d3d" font-family="Inter, Arial, sans-serif" font-size="11.75" font-weight="700" text-anchor="middle">N <tspan font-family="STIX Two Text, Cambria Math, Georgia, serif">&#x03F5;</tspan><tspan baseline-shift="super" font-size="9.25">+</tspan></text>
  <text x="40" y="43.00" fill="#f5f7ff" font-family="Inter, Arial, sans-serif" font-size="11.75" font-weight="700" text-anchor="middle">Pass Thru</text>
  <text x="40" y="58.00" fill="#1879ff" font-family="Inter, Arial, sans-serif" font-size="11.75" font-weight="700" text-anchor="middle">N <tspan font-family="STIX Two Text, Cambria Math, Georgia, serif">&#x03F5;</tspan><tspan baseline-shift="super" font-size="9.25">-</tspan></text>
</svg>