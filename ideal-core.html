<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080b12" />
    <title>Ideal Core Prototype</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080b12;
        color: #eef3ff;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }

      button,
      input,
      select {
        font: inherit;
      }

      #ideal-core-app {
        position: relative;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at center, rgba(42, 54, 79, 0.5), rgba(8, 11, 18, 0) 44%),
          linear-gradient(180deg, #111722 0%, #070a11 100%);
      }

      #ideal-core-canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }

      .ideal-core-stage-ring {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(62vw, 70vh);
        aspect-ratio: 1;
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        box-shadow:
          inset 0 0 36px rgba(120, 184, 255, 0.08),
          0 0 48px rgba(56, 189, 248, 0.05);
      }

      .ideal-core-title {
        position: absolute;
        left: 50%;
        top: 18px;
        transform: translateX(-50%);
        color: rgba(238, 243, 255, 0.92);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0;
        text-align: center;
        pointer-events: none;
      }

      .ideal-core-panel {
        position: absolute;
        width: 292px;
        padding: 12px;
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 8px;
        background: rgba(8, 11, 18, 0.78);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(10px);
      }

      .ideal-core-panel h2 {
        margin: 0 0 10px;
        color: rgba(238, 243, 255, 0.95);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .ideal-core-panel.is-upper-left {
        left: 16px;
        top: 16px;
      }

      .ideal-core-panel.is-upper-right {
        right: 16px;
        top: 16px;
      }

      .ideal-core-panel.is-lower-left {
        left: 16px;
        bottom: 16px;
      }

      .ideal-core-panel.is-lower-right {
        right: 16px;
        bottom: 16px;
        width: 352px;
      }

      .ideal-core-segmented {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
      }

      .ideal-core-button,
      .ideal-core-segmented button {
        min-height: 32px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 6px;
        background: rgba(17, 24, 39, 0.85);
        color: rgba(238, 243, 255, 0.88);
        cursor: pointer;
      }

      .ideal-core-button:hover,
      .ideal-core-segmented button:hover {
        border-color: rgba(125, 211, 252, 0.58);
      }

      .ideal-core-button.is-active,
      .ideal-core-segmented button.is-active {
        border-color: rgba(251, 191, 36, 0.85);
        background: rgba(40, 34, 20, 0.92);
        color: #fff8e6;
      }

      .ideal-core-control-stack {
        display: grid;
        gap: 10px;
      }

      .ideal-core-toggle-row,
      .ideal-core-range-row,
      .ideal-core-command-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .ideal-core-range-row {
        grid-template-columns: 72px 1fr 46px;
        align-items: center;
      }

      .ideal-core-range-row label,
      .ideal-core-readout-label {
        color: rgba(203, 213, 225, 0.76);
        font-size: 12px;
      }

      .ideal-core-range-row output,
      .ideal-core-readout-value {
        color: rgba(238, 243, 255, 0.92);
        font-size: 12px;
        text-align: right;
      }

      input[type="range"] {
        width: 100%;
        accent-color: #fbbf24;
      }

      .ideal-core-readout-grid {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 7px 12px;
        margin-top: 10px;
      }

      #ideal-core-potential-strip {
        width: 100%;
        height: 84px;
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 6px;
        background: rgba(2, 6, 23, 0.55);
      }

      .ideal-core-reserved {
        min-height: 90px;
        display: grid;
        align-content: center;
        gap: 8px;
        color: rgba(203, 213, 225, 0.78);
        font-size: 12px;
      }

      .ideal-core-reserved strong {
        color: rgba(238, 243, 255, 0.9);
      }

      .ideal-core-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      .ideal-core-table th,
      .ideal-core-table td {
        padding: 6px 5px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
        text-align: right;
        white-space: nowrap;
      }

      .ideal-core-table th:first-child,
      .ideal-core-table td:first-child {
        text-align: left;
        color: rgba(203, 213, 225, 0.78);
      }

      .ideal-core-table th {
        color: rgba(238, 243, 255, 0.9);
        font-weight: 700;
      }

      @media (max-width: 900px), (max-height: 680px) {
        .ideal-core-title {
          display: none;
        }

        .ideal-core-stage-ring {
          width: min(82vw, 58vh);
        }

        .ideal-core-panel {
          width: calc(50vw - 18px);
          padding: 8px;
        }

        .ideal-core-panel h2 {
          margin-bottom: 7px;
          font-size: 11px;
        }

        .ideal-core-panel.is-upper-left {
          left: 10px;
          top: 10px;
        }

        .ideal-core-panel.is-upper-right {
          right: 10px;
          top: 10px;
        }

        .ideal-core-panel.is-lower-left {
          display: none;
        }

        .ideal-core-panel.is-lower-right {
          left: 10px;
          right: 10px;
          bottom: 10px;
          width: auto;
        }

        #ideal-core-potential-strip {
          height: 48px;
        }

        .ideal-core-segmented,
        .ideal-core-toggle-row,
        .ideal-core-command-row {
          gap: 5px;
        }

        .ideal-core-button,
        .ideal-core-segmented button {
          min-height: 28px;
          font-size: 11px;
        }

        .ideal-core-range-row {
          grid-template-columns: 48px 1fr 36px;
          gap: 5px;
        }

        .ideal-core-readout-grid,
        .ideal-core-range-row label,
        .ideal-core-range-row output,
        .ideal-core-readout-label,
        .ideal-core-readout-value,
        .ideal-core-table {
          font-size: 10px;
        }

        .ideal-core-table th,
        .ideal-core-table td {
          padding: 4px 3px;
        }
      }
    </style>
  </head>
  <body>
    <main id="ideal-core-app">
      <canvas id="ideal-core-canvas" tabindex="0" aria-label="Ideal Core prototype stage"></canvas>
      <div class="ideal-core-stage-ring" aria-hidden="true"></div>
      <div class="ideal-core-title">Ideal Core Prototype</div>

      <section class="ideal-core-panel is-upper-left" aria-label="Graph zone">
        <h2>Field Panel</h2>
        <canvas id="ideal-core-potential-strip" width="536" height="168" aria-hidden="true"></canvas>
        <div class="ideal-core-readout-grid" aria-live="polite">
          <div class="ideal-core-readout-label">Selected view</div>
          <div id="ideal-core-view-label" class="ideal-core-readout-value">Full</div>
          <div class="ideal-core-readout-label">Surface range</div>
          <div id="ideal-core-range-label" class="ideal-core-readout-value">0.00</div>
          <div class="ideal-core-readout-label">Sample sum</div>
          <div id="ideal-core-sample-label" class="ideal-core-readout-value">0.00</div>
        </div>
      </section>

      <section class="ideal-core-panel is-upper-right" aria-label="Control panel">
        <h2>Controls</h2>
        <div class="ideal-core-control-stack">
          <div class="ideal-core-segmented" role="group" aria-label="Field view">
            <button type="button" data-view="all" class="is-active">Full</button>
            <button type="button" data-view="inner">Inner</button>
            <button type="button" data-view="middle">Middle</button>
            <button type="button" data-view="outer">Outer</button>
          </div>
          <div class="ideal-core-toggle-row">
            <button id="ideal-core-path-toggle" class="ideal-core-button is-active" type="button">Paths</button>
            <button id="ideal-core-surface-toggle" class="ideal-core-button is-active" type="button">Surface</button>
            <button id="ideal-core-axes-toggle" class="ideal-core-button is-active" type="button">Axes</button>
            <button id="ideal-core-freeze-toggle" class="ideal-core-button" type="button">Freeze</button>
          </div>
          <div class="ideal-core-range-row">
            <label for="ideal-core-radius-input">Radius</label>
            <input id="ideal-core-radius-input" type="range" min="1.1" max="2.2" step="0.02" value="1.62" />
            <output id="ideal-core-radius-output" for="ideal-core-radius-input">1.62</output>
          </div>
          <div class="ideal-core-range-row">
            <label for="ideal-core-speed-input">Speed</label>
            <input id="ideal-core-speed-input" type="range" min="0.2" max="2.4" step="0.05" value="1" />
            <output id="ideal-core-speed-output" for="ideal-core-speed-input">1.00</output>
          </div>
          <div class="ideal-core-command-row">
            <button id="ideal-core-reset-button" class="ideal-core-button" type="button">Reset</button>
            <button id="ideal-core-focus-button" class="ideal-core-button" type="button">Focus</button>
          </div>
        </div>
      </section>

      <section class="ideal-core-panel is-lower-left" aria-label="Reserved equation zone">
        <h2>Reserved Equation Zone</h2>
        <div class="ideal-core-reserved">
          <strong>Formula surfaces deferred.</strong>
          <span>Prototype math is in the design appendix.</span>
        </div>
      </section>

      <section class="ideal-core-panel is-lower-right" aria-label="Binary measures table">
        <h2>Binary Measures</h2>
        <table class="ideal-core-table">
          <thead>
            <tr>
              <th>Measure</th>
              <th>Inner</th>
              <th>Middle</th>
              <th>Outer</th>
            </tr>
          </thead>
          <tbody id="ideal-core-table-body"></tbody>
        </table>
      </section>
    </main>
    <script type="module" src="./src/apps/ideal-core/main.js"></script>
  </body>
</html>
