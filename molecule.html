<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6d28d9" />
    <title>Molecule Visualization</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #6d28d9;
        color: #ffffff;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }

      button {
        font: inherit;
      }

      #molecule-app {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        background: #6d28d9;
      }

      .molecule-stage {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: #6d28d9;
      }

      #molecule-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }

      .molecule-stage-topbar {
        position: absolute;
        left: 16px;
        right: 16px;
        top: 16px;
        z-index: 2;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        pointer-events: none;
      }

      .molecule-title-block {
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        background: rgba(76, 29, 149, 0.58);
        box-shadow: 0 14px 34px rgba(30, 46, 35, 0.12);
        backdrop-filter: blur(8px);
      }

      .molecule-title-block h1 {
        margin: 0;
        color: #ffffff;
        font-size: 18px;
        line-height: 1.12;
        font-weight: 780;
        letter-spacing: 0;
      }

      .molecule-title-block p {
        margin: 3px 0 0;
        color: rgba(255, 255, 255, 0.78);
        font-size: 12px;
        line-height: 1.35;
      }

      .molecule-toolbar {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        pointer-events: auto;
      }

      .molecule-button {
        min-height: 32px;
        padding: 0 10px;
        border: 1px solid rgba(42, 64, 49, 0.18);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.86);
        color: #1c2b20;
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
        cursor: pointer;
      }

      .molecule-icon-button {
        width: 32px;
        height: 32px;
        padding: 0;
        display: inline-grid;
        place-items: center;
      }

      .molecule-icon-button svg {
        width: 17px;
        height: 17px;
        stroke-width: 2.2;
      }

      .molecule-button:hover,
      .molecule-button:focus-visible {
        border-color: rgba(15, 118, 110, 0.58);
        outline: none;
      }

      .molecule-button:active {
        transform: translateY(1px);
      }

      .molecule-readout {
        position: absolute;
        left: 50%;
        bottom: 16px;
        z-index: 2;
        width: min(364px, calc(100% - 32px));
        color: #ffffff;
        transform: translateX(-50%);
      }

      .molecule-readout-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .molecule-readout.is-atom-hover .molecule-readout-secondary-summary-field {
        display: none;
      }

      .molecule-readout.is-atom-hover .molecule-readout-formula-field {
        grid-column: 1 / -1;
      }

      .molecule-readout-field {
        min-width: 0;
        min-height: 58px;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        background: rgba(76, 29, 149, 0.58);
        box-shadow: 0 14px 34px rgba(30, 46, 35, 0.12);
        backdrop-filter: blur(8px);
      }

      .molecule-readout-field span {
        display: block;
        overflow: hidden;
        color: rgba(255, 255, 255, 0.78);
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 0.04em;
        line-height: 1.2;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .molecule-readout-field strong {
        display: block;
        margin-top: 4px;
        overflow: hidden;
        color: #ffffff;
        font-size: 13px;
        font-weight: 780;
        line-height: 1.25;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .molecule-atom-label {
        position: absolute;
        z-index: 4;
        max-width: 160px;
        padding: 7px 9px;
        border: 1px solid rgba(255, 255, 255, 0.34);
        border-radius: 8px;
        background: rgba(76, 29, 149, 0.9);
        color: #ffffff;
        box-shadow: 0 14px 34px rgba(30, 46, 35, 0.18);
        font-size: 12px;
        font-weight: 780;
        line-height: 1.15;
        pointer-events: none;
        text-align: center;
        transform: translate(-50%, -100%) translateY(-12px);
        white-space: nowrap;
      }

      .molecule-atom-label[hidden] {
        display: none;
      }

      .molecule-side {
        min-width: 0;
        min-height: 0;
        border-left: 1px solid rgba(255, 255, 255, 0.24);
        background: #6d28d9;
        color: #ffffff;
        display: grid;
        grid-template-rows: minmax(0, 1fr);
      }

      .molecule-preset-list {
        min-height: 0;
        overflow: auto;
        padding: 10px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-content: start;
        gap: 8px;
      }

      .molecule-preset-button {
        width: 100%;
        min-height: 58px;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        background: rgba(76, 29, 149, 0.58);
        color: #ffffff;
        cursor: pointer;
        text-align: left;
      }

      .molecule-preset-button:hover,
      .molecule-preset-button:focus-visible {
        border-color: rgba(255, 255, 255, 0.72);
        background: rgba(76, 29, 149, 0.78);
        outline: none;
      }

      .molecule-preset-button.is-active {
        border-color: rgba(255, 255, 255, 0.92);
        background: rgba(255, 255, 255, 0.18);
      }

      .molecule-preset-button strong {
        display: block;
        overflow: hidden;
        font-size: 13px;
        font-weight: 780;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .molecule-preset-button span {
        display: block;
        margin-top: 4px;
        overflow: hidden;
        color: rgba(255, 255, 255, 0.78);
        font-size: 11px;
        line-height: 1.3;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #molecule-boot-error {
        position: absolute;
        inset: 20px;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 18px;
        border: 1px solid rgba(185, 28, 28, 0.34);
        border-radius: 8px;
        background: #fff7f6;
        color: #7f1d1d;
        font-size: 14px;
        font-weight: 700;
        text-align: center;
      }

      @media (max-width: 860px) {
        html,
        body {
          height: auto;
          min-height: 100%;
          overflow: auto;
        }

        #molecule-app {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(420px, 58vh) minmax(300px, auto);
          min-height: 100vh;
          height: auto;
        }

        .molecule-side {
          border-left: 0;
          border-top: 1px solid rgba(255, 255, 255, 0.24);
        }

        .molecule-preset-list {
          max-height: none;
          overflow: visible;
        }
      }

      @media (max-width: 560px) {
        .molecule-stage-topbar {
          left: 10px;
          right: 10px;
          top: 10px;
          flex-direction: column;
        }

        .molecule-title-block {
          width: 100%;
        }

        .molecule-toolbar {
          width: 100%;
        }

        .molecule-button {
          flex: 1 1 0;
        }

        .molecule-icon-button {
          flex: 0 0 32px;
        }

        .molecule-readout {
          left: 10px;
          right: 10px;
          bottom: 10px;
          width: auto;
          transform: none;
        }

        .molecule-readout-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 6px;
        }

        .molecule-preset-list {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main id="molecule-app">
      <section class="molecule-stage" aria-label="molecule viewer">
        <canvas id="molecule-canvas"></canvas>
        <div id="molecule-atom-label" class="molecule-atom-label" aria-hidden="true" hidden></div>
        <div class="molecule-stage-topbar">
          <div class="molecule-title-block">
            <h1 id="molecule-title">Molecule</h1>
            <p id="molecule-subtitle">Preset molecule catalog</p>
          </div>
          <div class="molecule-toolbar">
            <button
              id="molecule-home-button"
              type="button"
              class="molecule-button molecule-icon-button"
              aria-label="Applications"
              title="Applications"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 10.8 9-7.2 9 7.2" />
                <path d="M5.2 9.6V20h4.9v-5.6h3.8V20h4.9V9.6" />
              </svg>
            </button>
          </div>
        </div>
        <div class="molecule-readout" aria-live="polite">
          <div class="molecule-readout-grid">
            <div class="molecule-readout-field molecule-readout-summary-field molecule-readout-formula-field">
              <span>Formula</span>
              <strong id="molecule-formula">-</strong>
            </div>
            <div class="molecule-readout-field molecule-readout-summary-field molecule-readout-secondary-summary-field">
              <span>Atoms</span>
              <strong id="molecule-atom-count">-</strong>
            </div>
            <div class="molecule-readout-field molecule-readout-summary-field molecule-readout-secondary-summary-field">
              <span>Bonds</span>
              <strong id="molecule-bond-count">-</strong>
            </div>
            <div class="molecule-readout-field">
              <span>Protons</span>
              <strong id="molecule-proton-count">-</strong>
            </div>
            <div class="molecule-readout-field">
              <span>Neutrons</span>
              <strong id="molecule-neutron-count">-</strong>
            </div>
            <div class="molecule-readout-field">
              <span>Electrons</span>
              <strong id="molecule-electron-count">-</strong>
            </div>
            <div class="molecule-readout-field">
              <span>Electrinos</span>
              <strong id="molecule-electrino-count">-</strong>
            </div>
            <div class="molecule-readout-field">
              <span>Positrinos</span>
              <strong id="molecule-positrino-count">-</strong>
            </div>
            <div class="molecule-readout-field">
              <span>Architrinos</span>
              <strong id="molecule-architrino-count">-</strong>
            </div>
          </div>
        </div>
      </section>
      <aside class="molecule-side">
        <div id="molecule-preset-list" class="molecule-preset-list"></div>
      </aside>
    </main>
    <script type="module" src="./src/apps/molecule/main.js"></script>
  </body>
</html>
