<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4b0082" />
    <title>Causal Delay Feedback</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #4b0082;
        color: #f6f7ff;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }

      button,
      input,
      select {
        font: inherit;
      }

      #causal-delay-feedback-app {
        position: relative;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: #4b0082;
      }

      #causal-delay-feedback-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }

      .causal-toolbar {
        position: absolute;
        top: max(20px, env(safe-area-inset-top));
        left: max(20px, env(safe-area-inset-left));
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: calc(100vw - 40px);
        padding: 10px 12px;
        border: 1px solid rgba(224, 207, 255, 0.34);
        border-radius: 8px;
        background: rgba(6, 6, 12, 0.84);
        box-shadow: 0 18px 36px rgba(12, 4, 24, 0.24);
        backdrop-filter: blur(10px);
      }

      .causal-title {
        min-width: 0;
        white-space: nowrap;
      }

      .causal-title strong {
        display: block;
        color: #ffffff;
        font-size: 20px;
        font-weight: 780;
        line-height: 1;
        letter-spacing: 0;
      }

      .causal-preset {
        width: min(250px, 26vw);
        height: 34px;
        min-width: 168px;
        border: 1px solid rgba(224, 207, 255, 0.38);
        border-radius: 6px;
        background: rgba(35, 18, 55, 0.9);
        color: #f6f7ff;
        font-size: 13px;
        font-weight: 700;
        outline: none;
      }

      .causal-source-chip {
        display: inline-flex;
        align-items: center;
        height: 26px;
        max-width: 190px;
        padding: 0 9px;
        border: 1px solid rgba(224, 207, 255, 0.28);
        border-radius: 6px;
        background: rgba(34, 18, 54, 0.74);
        color: rgba(224, 230, 255, 0.76);
        font-size: 11px;
        font-weight: 760;
        line-height: 1;
        white-space: nowrap;
      }

      .causal-source-chip[data-state="loading"] {
        border-color: rgba(255, 218, 89, 0.54);
        color: rgba(255, 235, 145, 0.94);
      }

      .causal-source-chip[data-state="bridge"] {
        border-color: rgba(74, 229, 255, 0.54);
        color: rgba(148, 239, 255, 0.94);
      }

      .causal-source-chip[data-state="fallback"] {
        border-color: rgba(255, 150, 166, 0.52);
        color: rgba(255, 186, 198, 0.94);
      }

      .causal-source-chip[data-state="draft"] {
        border-color: rgba(255, 218, 89, 0.54);
        color: rgba(255, 235, 145, 0.94);
      }

      .causal-icon-button {
        position: relative;
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        padding: 0;
        border: 1px solid rgba(224, 207, 255, 0.38);
        border-radius: 6px;
        background: rgba(36, 20, 55, 0.9);
        color: rgba(246, 247, 255, 0.9);
        cursor: pointer;
      }

      .causal-icon-button[data-tooltip]::after {
        position: absolute;
        top: calc(100% + 8px);
        left: 50%;
        z-index: 10;
        max-width: min(220px, calc(100vw - 32px));
        padding: 6px 8px;
        border: 1px solid rgba(224, 207, 255, 0.34);
        border-radius: 6px;
        background: rgba(6, 6, 12, 0.94);
        color: #f6f7ff;
        content: attr(data-tooltip);
        font-size: 11px;
        font-weight: 700;
        line-height: 1.2;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -2px);
        transition: opacity 120ms ease, transform 120ms ease;
        white-space: nowrap;
      }

      .causal-icon-button[data-tooltip]:hover::after,
      .causal-icon-button[data-tooltip]:focus-visible::after {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .causal-icon-button:hover,
      .causal-icon-button:focus-visible,
      .causal-preset:hover,
      .causal-preset:focus-visible {
        border-color: rgba(246, 247, 255, 0.72);
        outline: none;
      }

      .causal-icon-button svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 2.1;
        fill: none;
      }

      .causal-icon-button.is-active {
        border-color: rgba(74, 229, 255, 0.72);
        color: #4ae5ff;
      }

      .causal-legend {
        position: absolute;
        top: max(84px, calc(env(safe-area-inset-top) + 84px));
        left: max(20px, env(safe-area-inset-left));
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        max-width: calc(100vw - 40px);
        pointer-events: none;
      }

      .causal-legend-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 30px;
        padding: 6px 10px;
        border: 1px solid rgba(224, 207, 255, 0.28);
        border-radius: 6px;
        background: rgba(34, 18, 54, 0.78);
        color: rgba(246, 247, 255, 0.86);
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
        backdrop-filter: blur(8px);
      }

      .causal-legend-line {
        width: 28px;
        height: 12px;
        position: relative;
      }

      .causal-legend-line::before,
      .causal-legend-line::after {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        content: "";
      }

      .causal-legend-line::before {
        top: 3px;
        background: #ff0000;
      }

      .causal-legend-line::after {
        bottom: 3px;
        background: #0000ff;
      }

      .causal-legend-dots {
        display: inline-grid;
        grid-template-columns: repeat(5, 4px);
        grid-auto-rows: 4px;
        gap: 3px;
      }

      .causal-legend-dots i {
        width: 4px;
        height: 4px;
        border-radius: 999px;
        background: #ff96a6;
      }

      .causal-legend-dots i:nth-child(even) {
        background: #96aaff;
      }

      .causal-settings {
        position: absolute;
        top: max(66px, calc(env(safe-area-inset-top) + 66px));
        left: max(630px, calc(env(safe-area-inset-left) + 630px));
        z-index: 3;
        display: grid;
        gap: 8px;
        min-width: 268px;
        padding: 10px;
        border: 1px solid rgba(224, 207, 255, 0.34);
        border-radius: 8px;
        background: rgba(6, 6, 12, 0.9);
        box-shadow: 0 18px 36px rgba(12, 4, 24, 0.28);
        backdrop-filter: blur(10px);
      }

      .causal-settings[hidden] {
        display: none;
      }

      .causal-settings-label {
        color: rgba(224, 230, 255, 0.72);
        font-size: 11px;
        font-weight: 760;
        line-height: 1;
      }

      .causal-swatch-row {
        display: flex;
        gap: 8px;
      }

      .causal-depth-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }

      .causal-depth-button {
        height: 28px;
        border: 1px solid rgba(246, 247, 255, 0.28);
        border-radius: 6px;
        background: rgba(36, 20, 55, 0.9);
        color: rgba(246, 247, 255, 0.8);
        cursor: pointer;
        font-size: 12px;
        font-weight: 760;
        line-height: 1;
      }

      .causal-depth-button.is-active {
        border-color: rgba(74, 229, 255, 0.72);
        color: #4ae5ff;
      }

      .causal-slider-row {
        display: grid;
        grid-template-columns: minmax(128px, 1fr) 62px;
        align-items: center;
        gap: 8px;
      }

      .causal-slider-row.has-step-buttons {
        grid-template-columns: 28px minmax(118px, 1fr) 28px 78px;
      }

      .causal-range {
        height: 18px;
        width: 100%;
        accent-color: #4ae5ff;
        appearance: none;
        background: transparent;
        cursor: pointer;
      }

      .causal-range::-webkit-slider-runnable-track {
        height: 4px;
        border: 1px solid rgba(224, 207, 255, 0.18);
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(74, 229, 255, 0.68), rgba(255, 150, 166, 0.58));
        box-shadow: inset 0 0 0 1px rgba(6, 6, 12, 0.42);
      }

      .causal-range::-webkit-slider-thumb {
        width: 16px;
        height: 16px;
        margin-top: -7px;
        border: 1px solid rgba(246, 247, 255, 0.88);
        border-radius: 999px;
        appearance: none;
        background: #4ae5ff;
        box-shadow:
          0 0 0 3px rgba(74, 229, 255, 0.16),
          0 2px 8px rgba(0, 0, 0, 0.32);
      }

      .causal-range::-moz-range-track {
        height: 4px;
        border: 1px solid rgba(224, 207, 255, 0.18);
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(74, 229, 255, 0.68), rgba(255, 150, 166, 0.58));
        box-shadow: inset 0 0 0 1px rgba(6, 6, 12, 0.42);
      }

      .causal-range::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border: 1px solid rgba(246, 247, 255, 0.88);
        border-radius: 999px;
        background: #4ae5ff;
        box-shadow:
          0 0 0 3px rgba(74, 229, 255, 0.16),
          0 2px 8px rgba(0, 0, 0, 0.32);
      }

      .causal-range:focus-visible {
        outline: 2px solid rgba(246, 247, 255, 0.76);
        outline-offset: 4px;
      }

      .causal-step-button {
        display: inline-grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 1px solid rgba(246, 247, 255, 0.28);
        border-radius: 6px;
        background: rgba(36, 20, 55, 0.9);
        color: rgba(246, 247, 255, 0.86);
        cursor: pointer;
        font-size: 14px;
        font-weight: 800;
        line-height: 1;
      }

      .causal-step-button:hover,
      .causal-step-button:focus-visible {
        border-color: rgba(246, 247, 255, 0.72);
        color: #ffffff;
        outline: none;
      }

      .causal-speed-value {
        color: rgba(246, 247, 255, 0.9);
        font-size: 11px;
        font-weight: 760;
        line-height: 1;
        text-align: right;
        white-space: nowrap;
      }

      .causal-swatch {
        width: 30px;
        height: 30px;
        padding: 0;
        border: 1px solid rgba(246, 247, 255, 0.38);
        border-radius: 999px;
        cursor: pointer;
      }

      .causal-swatch.is-active {
        box-shadow:
          0 0 0 2px rgba(6, 6, 12, 0.9),
          0 0 0 4px rgba(246, 247, 255, 0.78);
      }

      .causal-hover-label {
        position: absolute;
        z-index: 4;
        min-width: 0;
        padding: 6px 8px;
        border: 1px solid rgba(224, 207, 255, 0.3);
        border-radius: 6px;
        background: rgba(6, 6, 12, 0.82);
        color: #f6f7ff;
        font-size: 12px;
        font-weight: 760;
        pointer-events: none;
        transform: translate(12px, 10px);
        backdrop-filter: blur(8px);
      }

      .causal-hover-label[hidden] {
        display: none;
      }

      .causal-readout {
        position: absolute;
        bottom: max(22px, env(safe-area-inset-bottom));
        left: max(22px, env(safe-area-inset-left));
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        row-gap: 6px;
        max-width: min(740px, calc(100vw - 44px));
        min-height: 42px;
        padding: 8px 12px;
        border: 1px solid rgba(224, 207, 255, 0.28);
        border-radius: 8px;
        background: rgba(6, 6, 12, 0.72);
        color: #f6f7ff;
        font-size: 12px;
        font-weight: 720;
        line-height: 1.2;
        pointer-events: none;
        backdrop-filter: blur(8px);
      }

      .causal-readout[hidden] {
        display: none;
      }

      .causal-readout strong {
        color: #ffffff;
        font-size: 13px;
        font-weight: 780;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .causal-readout span {
        color: rgba(224, 230, 255, 0.78);
        white-space: nowrap;
      }

      #causal-delay-feedback-boot-error {
        position: absolute;
        right: 16px;
        bottom: 16px;
        z-index: 5;
        max-width: min(420px, calc(100vw - 32px));
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 8px;
        background: rgba(6, 6, 12, 0.88);
        color: #ffffff;
        font-size: 13px;
        font-weight: 700;
      }

      @media (max-width: 820px) {
        .causal-toolbar {
          right: max(12px, env(safe-area-inset-right));
          left: max(12px, env(safe-area-inset-left));
          flex-wrap: wrap;
        }

        .causal-title {
          flex: 1 1 100%;
        }

        .causal-preset {
          flex: 1 1 170px;
          width: auto;
        }

        .causal-legend {
          top: max(132px, calc(env(safe-area-inset-top) + 132px));
          left: max(12px, env(safe-area-inset-left));
        }

        .causal-settings {
          top: max(118px, calc(env(safe-area-inset-top) + 118px));
          right: max(12px, env(safe-area-inset-right));
          left: auto;
        }

        .causal-readout {
          right: max(12px, env(safe-area-inset-right));
          left: max(12px, env(safe-area-inset-left));
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <main id="causal-delay-feedback-app">
      <canvas
        id="causal-delay-feedback-canvas"
        tabindex="0"
        aria-label="Causal delay feedback replay canvas"
      ></canvas>

      <div class="causal-toolbar" aria-label="Causal delay feedback controls">
        <div class="causal-title">
          <strong>Causal Delay Feedback</strong>
        </div>

        <select id="causal-delay-feedback-preset" class="causal-preset" aria-label="Preset"></select>

        <span
          id="causal-delay-feedback-replay-status"
          class="causal-source-chip"
          data-state="representative"
        >representative replay</span>

        <button
          id="causal-delay-feedback-play"
          class="causal-icon-button"
          type="button"
          aria-label="Pause replay"
          title="Pause replay"
          data-tooltip="Pause replay"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14" />
            <path d="M16 5v14" />
          </svg>
        </button>

        <button
          id="causal-delay-feedback-reset"
          class="causal-icon-button"
          type="button"
          aria-label="Reset replay"
          title="Reset replay"
          data-tooltip="Reset replay"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 8a8 8 0 1 1-1.6 7" />
            <path d="M6 3v5h5" />
          </svg>
        </button>

        <button
          id="causal-delay-feedback-settings"
          class="causal-icon-button"
          type="button"
          aria-expanded="false"
          aria-controls="causal-delay-feedback-settings-panel"
          aria-label="Canvas settings"
          title="Canvas settings"
          data-tooltip="Canvas settings"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3.4" />
            <path d="M12 2.8v3" />
            <path d="M12 18.2v3" />
            <path d="M4.6 4.6l2.1 2.1" />
            <path d="M17.3 17.3l2.1 2.1" />
            <path d="M2.8 12h3" />
            <path d="M18.2 12h3" />
            <path d="M4.6 19.4l2.1-2.1" />
            <path d="M17.3 6.7l2.1-2.1" />
          </svg>
        </button>
      </div>

      <div class="causal-legend" aria-label="Visual legend">
        <span class="causal-legend-chip"><span class="causal-legend-line" aria-hidden="true"></span>solid path history</span>
        <span class="causal-legend-chip">
          <span class="causal-legend-dots" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i>
          </span>
          dotted wakes
        </span>
      </div>

      <div
        id="causal-delay-feedback-settings-panel"
        class="causal-settings"
        role="dialog"
        aria-label="Settings"
        hidden
      >
        <div class="causal-settings-label">Canvas</div>
        <div class="causal-swatch-row" id="causal-delay-feedback-color-swatches"></div>
        <div class="causal-settings-label">c_f speed</div>
        <div class="causal-slider-row">
          <input
            id="causal-delay-feedback-cf-speed"
            class="causal-range"
            type="range"
            min="0.25"
            max="2.5"
            step="0.05"
            value="1"
            aria-label="c_f animation speed"
          />
          <output id="causal-delay-feedback-cf-speed-value" class="causal-speed-value">1x</output>
        </div>
        <div class="causal-settings-label">Architrino speed</div>
        <div class="causal-slider-row has-step-buttons">
          <button
            class="causal-step-button"
            type="button"
            data-architrino-speed-step="-1"
            aria-label="Decrease architrino speed"
          >&lt;</button>
          <input
            id="causal-delay-feedback-architrino-speed"
            class="causal-range"
            type="range"
            min="0"
            max="9"
            step="1"
            value="3"
            aria-label="Architrino speed as a fraction of c_f"
          />
          <button
            class="causal-step-button"
            type="button"
            data-architrino-speed-step="1"
            aria-label="Increase architrino speed"
          >&gt;</button>
          <output id="causal-delay-feedback-architrino-speed-value" class="causal-speed-value">0.7 c_f</output>
        </div>
        <div class="causal-settings-label">Retained points</div>
        <div class="causal-depth-row" id="causal-delay-feedback-history-depth"></div>
      </div>

      <div id="causal-delay-feedback-hover-label" class="causal-hover-label" hidden></div>
      <div id="causal-delay-feedback-readout" class="causal-readout" aria-live="polite" hidden></div>
    </main>

    <script type="module" src="./src/apps/causal-delay-feedback/main.js"></script>
  </body>
</html>
