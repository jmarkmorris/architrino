<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4b0082" />
    <title>Causal Delay Feedback</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #4b0082;
        color: #f6f7ff;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }

      button,
      input,
      select {
        font: inherit;
      }

      #causal-delay-feedback-app {
        position: relative;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: #4b0082;
      }

      #causal-delay-feedback-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }

      .causal-toolbar {
        position: absolute;
        top: max(20px, env(safe-area-inset-top));
        right: max(20px, env(safe-area-inset-right));
        left: max(20px, env(safe-area-inset-left));
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid rgba(224, 207, 255, 0.34);
        border-radius: 8px;
        background: rgba(6, 6, 12, 0.84);
        box-shadow: 0 18px 36px rgba(12, 4, 24, 0.24);
        backdrop-filter: blur(10px);
      }

      .causal-title {
        min-width: 0;
        white-space: nowrap;
      }

      .causal-title strong {
        display: block;
        color: #ffffff;
        font-size: 20px;
        font-weight: 780;
        line-height: 1;
        letter-spacing: 0;
      }

      .causal-switch-row {
        display: flex;
        flex: 0 0 auto;
        flex-wrap: wrap;
        gap: 6px;
      }

      .causal-switch-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 52px;
        height: 30px;
        padding: 0 9px;
        border: 1px solid rgba(224, 207, 255, 0.3);
        border-radius: 6px;
        background: rgba(36, 20, 55, 0.72);
        color: rgba(246, 247, 255, 0.74);
        cursor: pointer;
        font-size: 11px;
        font-weight: 780;
        line-height: 1;
        white-space: nowrap;
      }

      .causal-switch-button[aria-pressed="true"] {
        border-color: rgba(74, 229, 255, 0.72);
        background: rgba(38, 76, 90, 0.72);
        color: #f6f7ff;
      }

      .causal-source-chip {
        display: inline-flex;
        align-items: center;
        height: 26px;
        max-width: 190px;
        padding: 0 9px;
        border: 1px solid rgba(224, 207, 255, 0.28);
        border-radius: 6px;
        background: rgba(34, 18, 54, 0.74);
        color: rgba(224, 230, 255, 0.76);
        font-size: 11px;
        font-weight: 760;
        line-height: 1;
        white-space: nowrap;
      }

      .causal-source-chip[data-state="loading"] {
        border-color: rgba(255, 218, 89, 0.54);
        color: rgba(255, 235, 145, 0.94);
      }

      .causal-source-chip[data-state="bridge"] {
        border-color: rgba(74, 229, 255, 0.54);
        color: rgba(148, 239, 255, 0.94);
      }

      .causal-source-chip[data-state="bridge-seed"] {
        border-color: rgba(74, 229, 255, 0.48);
        color: rgba(255, 235, 145, 0.94);
      }

      .causal-source-chip[data-state="fallback"] {
        border-color: rgba(255, 150, 166, 0.52);
        color: rgba(255, 186, 198, 0.94);
      }

      .causal-source-chip[data-state="draft"] {
        border-color: rgba(255, 218, 89, 0.54);
        color: rgba(255, 235, 145, 0.94);
      }

      .causal-now-scrub {
        display: grid;
        flex: 1 1 520px;
        grid-template-columns: minmax(320px, 1fr) 48px;
        align-items: center;
        gap: 8px;
        min-width: 170px;
      }

      .causal-now-value {
        color: rgba(246, 247, 255, 0.86);
        font-size: 11px;
        font-weight: 760;
        line-height: 1;
        text-align: right;
        white-space: nowrap;
      }

      .causal-icon-button {
        position: relative;
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        padding: 0;
        border: 1px solid rgba(224, 207, 255, 0.38);
        border-radius: 6px;
        background: rgba(36, 20, 55, 0.9);
        color: rgba(246, 247, 255, 0.9);
        cursor: pointer;
      }

      .causal-icon-button[data-tooltip]::after {
        position: absolute;
        top: calc(100% + 8px);
        left: 50%;
        z-index: 10;
        max-width: min(220px, calc(100vw - 32px));
        padding: 6px 8px;
        border: 1px solid rgba(224, 207, 255, 0.34);
        border-radius: 6px;
        background: rgba(6, 6, 12, 0.94);
        color: #f6f7ff;
        content: attr(data-tooltip);
        font-size: 11px;
        font-weight: 700;
        line-height: 1.2;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -2px);
        transition: opacity 120ms ease, transform 120ms ease;
        white-space: nowrap;
      }

      .causal-icon-button[data-tooltip]:hover::after,
      .causal-icon-button[data-tooltip]:focus-visible::after {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .causal-icon-button:hover,
      .causal-icon-button:focus-visible,
      .causal-switch-button:hover,
      .causal-switch-button:focus-visible {
        border-color: rgba(246, 247, 255, 0.72);
        outline: none;
      }

      .causal-icon-button svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 2.1;
        fill: none;
      }

      .causal-icon-button.is-active {
        border-color: rgba(74, 229, 255, 0.72);
        color: #4ae5ff;
      }

      .causal-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        max-width: min(360px, 28vw);
        pointer-events: none;
      }

      .causal-legend-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 30px;
        padding: 6px 10px;
        border: 1px solid var(--causal-legend-border-color, rgba(224, 207, 255, 0.28));
        border-radius: 6px;
        background: var(--causal-selected-canvas-color, #4b0082);
        color: var(--causal-legend-text-color, rgba(246, 247, 255, 0.86));
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
        backdrop-filter: blur(8px);
      }

      .causal-legend-line {
        width: 34px;
        height: 22px;
        position: relative;
      }

      .causal-legend-line::before,
      .causal-legend-line::after {
        position: absolute;
        left: 0;
        right: 0;
        height: 5px;
        border-radius: 999px;
        content: "";
      }

      .causal-legend-line::before {
        top: 3px;
        background: var(--causal-positrino-color, #ff0000);
      }

      .causal-legend-line::after {
        bottom: 3px;
        background: var(--causal-electrino-color, #0000ff);
      }

      .causal-legend-dots {
        position: relative;
        width: 34px;
        height: 18px;
        flex: 0 0 34px;
      }

      .causal-legend-dots i {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 999px;
        background: var(--causal-positrino-wake-color, #ff96a6);
      }

      .causal-legend-dots i:nth-child(even) {
        background: var(--causal-electrino-wake-color, #96aaff);
      }

      .causal-legend-dots i:nth-child(1) {
        left: 1px;
        top: 12px;
      }

      .causal-legend-dots i:nth-child(2) {
        left: 8px;
        top: 7px;
      }

      .causal-legend-dots i:nth-child(3) {
        left: 16px;
        top: 5px;
      }

      .causal-legend-dots i:nth-child(4) {
        left: 24px;
        top: 7px;
      }

      .causal-legend-dots i:nth-child(5) {
        left: 31px;
        top: 12px;
      }

      .causal-settings {
        position: absolute;
        top: max(66px, calc(env(safe-area-inset-top) + 66px));
        left: max(630px, calc(env(safe-area-inset-left) + 630px));
        z-index: 3;
        display: grid;
        gap: 8px;
        min-width: 268px;
        padding: 10px;
        border: 1px solid rgba(224, 207, 255, 0.34);
        border-radius: 8px;
        background: rgba(6, 6, 12, 0.9);
        box-shadow: 0 18px 36px rgba(12, 4, 24, 0.28);
        backdrop-filter: blur(10px);
      }

      .causal-settings[hidden] {
        display: none;
      }

      .causal-settings-label {
        color: rgba(224, 230, 255, 0.72);
        font-size: 11px;
        font-weight: 760;
        line-height: 1;
      }

      .causal-math-label {
        display: inline-flex;
        align-items: baseline;
        gap: 1px;
      }

      .causal-math-label sub,
      .causal-speed-value sub {
        font-size: 0.68em;
        line-height: 0;
      }

      .causal-swatch-row {
        display: flex;
        gap: 8px;
      }

      .causal-slider-row {
        display: grid;
        grid-template-columns: minmax(128px, 1fr) 62px;
        align-items: center;
        gap: 8px;
      }

      .causal-slider-row.has-step-buttons {
        grid-template-columns: 28px minmax(118px, 1fr) 28px 78px;
      }

      .causal-range-wrap {
        position: relative;
        display: grid;
        align-items: start;
        min-height: 32px;
      }

      .causal-range {
        height: 18px;
        width: 100%;
        accent-color: #f6f7ff;
        appearance: none;
        background: transparent;
        cursor: pointer;
      }

      .causal-range::-webkit-slider-runnable-track {
        height: 4px;
        border: 1px solid rgba(224, 207, 255, 0.18);
        border-radius: 999px;
        background: rgba(246, 247, 255, 0.34);
        box-shadow: inset 0 0 0 1px rgba(6, 6, 12, 0.42);
      }

      .causal-range::-webkit-slider-thumb {
        width: 16px;
        height: 16px;
        margin-top: -7px;
        border: 1px solid rgba(246, 247, 255, 0.88);
        border-radius: 999px;
        appearance: none;
        background: #f6f7ff;
        box-shadow:
          0 0 0 3px rgba(246, 247, 255, 0.14),
          0 2px 8px rgba(0, 0, 0, 0.32);
      }

      .causal-range::-moz-range-track {
        height: 4px;
        border: 1px solid rgba(224, 207, 255, 0.18);
        border-radius: 999px;
        background: rgba(246, 247, 255, 0.34);
        box-shadow: inset 0 0 0 1px rgba(6, 6, 12, 0.42);
      }

      .causal-range::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border: 1px solid rgba(246, 247, 255, 0.88);
        border-radius: 999px;
        background: #f6f7ff;
        box-shadow:
          0 0 0 3px rgba(246, 247, 255, 0.14),
          0 2px 8px rgba(0, 0, 0, 0.32);
      }

      .causal-range:focus-visible {
        outline: 2px solid rgba(246, 247, 255, 0.76);
        outline-offset: 4px;
      }

      .causal-range-midpoint {
        position: absolute;
        top: 15px;
        left: 50%;
        display: grid;
        justify-items: center;
        gap: 2px;
        color: rgba(246, 247, 255, 0.78);
        font-size: 10px;
        font-weight: 760;
        line-height: 1;
        pointer-events: none;
        transform: translateX(-50%);
      }

      .causal-range-midpoint::before {
        width: 1px;
        height: 8px;
        background: rgba(246, 247, 255, 0.62);
        content: "";
      }

      .causal-step-button {
        display: inline-grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 1px solid rgba(246, 247, 255, 0.28);
        border-radius: 6px;
        background: rgba(36, 20, 55, 0.9);
        color: rgba(246, 247, 255, 0.86);
        cursor: pointer;
        font-size: 14px;
        font-weight: 800;
        line-height: 1;
      }

      .causal-step-button:hover,
      .causal-step-button:focus-visible {
        border-color: rgba(246, 247, 255, 0.72);
        color: #ffffff;
        outline: none;
      }

      .causal-settings-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 30px;
        padding: 0 10px;
        border: 1px solid rgba(246, 247, 255, 0.28);
        border-radius: 6px;
        background: rgba(36, 20, 55, 0.9);
        color: rgba(246, 247, 255, 0.86);
        cursor: pointer;
        font-size: 12px;
        font-weight: 780;
        line-height: 1;
      }

      .causal-settings-action:hover,
      .causal-settings-action:focus-visible {
        border-color: rgba(246, 247, 255, 0.72);
        color: #ffffff;
        outline: none;
      }

      .causal-speed-value {
        color: rgba(246, 247, 255, 0.9);
        font-size: 11px;
        font-weight: 760;
        line-height: 1;
        text-align: right;
        white-space: nowrap;
      }

      .causal-swatch {
        width: 30px;
        height: 30px;
        padding: 0;
        border: 1px solid rgba(246, 247, 255, 0.38);
        border-radius: 999px;
        cursor: pointer;
      }

      .causal-swatch.is-active {
        box-shadow:
          0 0 0 2px rgba(6, 6, 12, 0.9),
          0 0 0 4px rgba(246, 247, 255, 0.78);
      }

      .causal-readout {
        position: absolute;
        bottom: max(22px, env(safe-area-inset-bottom));
        left: max(22px, env(safe-area-inset-left));
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        row-gap: 6px;
        max-width: min(740px, calc(100vw - 44px));
        min-height: 42px;
        padding: 8px 12px;
        border: 1px solid rgba(224, 207, 255, 0.28);
        border-radius: 8px;
        background: rgba(6, 6, 12, 0.72);
        color: #f6f7ff;
        font-size: 12px;
        font-weight: 720;
        line-height: 1.2;
        pointer-events: none;
        backdrop-filter: blur(8px);
      }

      .causal-readout[hidden] {
        display: none;
      }

      .causal-readout strong {
        color: #ffffff;
        font-size: 13px;
        font-weight: 780;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .causal-readout span {
        color: rgba(224, 230, 255, 0.78);
        white-space: nowrap;
      }

      #causal-delay-feedback-boot-error {
        position: absolute;
        right: 16px;
        bottom: 16px;
        z-index: 5;
        max-width: min(420px, calc(100vw - 32px));
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 8px;
        background: rgba(6, 6, 12, 0.88);
        color: #ffffff;
        font-size: 13px;
        font-weight: 700;
      }

      .causal-journey {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
      }

      .causal-mode-tabs {
        position: absolute;
        top: max(16px, env(safe-area-inset-top));
        left: 50%;
        display: flex;
        gap: 4px;
        max-width: calc(100vw - 32px);
        padding: 5px;
        overflow-x: auto;
        border: 1px solid rgba(224, 207, 255, 0.34);
        border-radius: 8px;
        background: rgba(6, 6, 12, 0.88);
        box-shadow: 0 18px 36px rgba(12, 4, 24, 0.24);
        pointer-events: auto;
        scrollbar-width: none;
        transform: translateX(-50%);
        backdrop-filter: blur(12px);
      }

      .causal-mode-tabs::-webkit-scrollbar {
        display: none;
      }

      .causal-mode-tab,
      .causal-guided-button,
      .causal-choice-button,
      .causal-ledger-button {
        min-height: 32px;
        border: 1px solid rgba(224, 207, 255, 0.3);
        border-radius: 6px;
        background: rgba(36, 20, 55, 0.9);
        color: rgba(246, 247, 255, 0.9);
        cursor: pointer;
        font-size: 12px;
        font-weight: 760;
      }

      .causal-mode-tab {
        flex: 0 0 auto;
        padding: 0 10px;
        white-space: nowrap;
      }

      .causal-mode-tab[aria-current="step"] {
        border-color: rgba(74, 229, 255, 0.74);
        background: rgba(38, 76, 90, 0.78);
        color: #ffffff;
      }

      .causal-mode-tab:hover,
      .causal-mode-tab:focus-visible,
      .causal-guided-button:hover,
      .causal-guided-button:focus-visible,
      .causal-choice-button:hover,
      .causal-choice-button:focus-visible,
      .causal-ledger-button:hover,
      .causal-ledger-button:focus-visible {
        border-color: rgba(246, 247, 255, 0.78);
        outline: 2px solid rgba(74, 229, 255, 0.48);
        outline-offset: 1px;
      }

      .causal-mode-tab:disabled,
      .causal-guided-button:disabled,
      .causal-ledger-button:disabled {
        cursor: not-allowed;
        opacity: 0.4;
      }

      .causal-lesson-panel {
        position: absolute;
        top: max(70px, calc(env(safe-area-inset-top) + 70px));
        left: max(18px, env(safe-area-inset-left));
        display: grid;
        gap: 10px;
        width: min(410px, calc(100vw - 36px));
        max-height: calc(100vh - 94px);
        padding: 16px;
        overflow: auto;
        border: 1px solid rgba(224, 207, 255, 0.34);
        border-radius: 12px;
        background: rgba(6, 6, 12, 0.9);
        box-shadow: 0 22px 46px rgba(8, 2, 20, 0.38);
        pointer-events: auto;
        backdrop-filter: blur(14px);
      }

      .causal-lesson-panel[hidden] {
        display: none;
      }

      .causal-lesson-meta {
        color: #7feeff;
        font-size: 11px;
        font-weight: 780;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .causal-lesson-panel h1 {
        margin: 0;
        color: #ffffff;
        font-size: 24px;
        line-height: 1.12;
      }

      .causal-lesson-body,
      .causal-lesson-status,
      .causal-fold-note,
      .causal-vector-sum,
      .causal-state-card p {
        margin: 0;
        color: rgba(236, 240, 255, 0.84);
        font-size: 14px;
        line-height: 1.48;
      }

      .causal-lesson-status {
        padding: 9px 10px;
        border-left: 3px solid #7feeff;
        background: rgba(74, 229, 255, 0.08);
      }

      .causal-lesson-content {
        display: grid;
        gap: 10px;
        min-width: 0;
      }

      .causal-event-readout {
        display: grid;
        grid-template-columns: minmax(120px, 1fr) 1fr;
        gap: 5px 10px;
        margin: 0;
        font-size: 12px;
      }

      .causal-event-readout dt {
        color: rgba(224, 230, 255, 0.62);
      }

      .causal-event-readout dd {
        margin: 0;
        color: #ffffff;
        font-weight: 700;
        text-align: right;
      }

      .causal-prediction-choices,
      .causal-self-hit-grid {
        display: grid;
        gap: 8px;
      }

      .causal-choice-button {
        min-height: 42px;
        padding: 8px 10px;
        text-align: left;
      }

      .causal-choice-button[data-answer="correct"] {
        border-color: #7affb7;
        background: rgba(47, 128, 83, 0.34);
      }

      .causal-choice-button[data-answer="incorrect"] {
        border-color: #ff96a6;
        background: rgba(128, 47, 67, 0.34);
      }

      .causal-ledger-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
        line-height: 1.3;
      }

      .causal-ledger-table th,
      .causal-ledger-table td {
        padding: 7px 6px;
        border-bottom: 1px solid rgba(224, 207, 255, 0.16);
        overflow-wrap: anywhere;
        text-align: left;
        vertical-align: top;
      }

      .causal-vector-sum {
        overflow-wrap: anywhere;
      }

      .causal-branch-swatch {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 5px;
        border: 1px solid currentColor;
        border-radius: 50%;
      }

      .causal-branch-filters {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .causal-branch-filters label {
        display: grid;
        gap: 4px;
        color: rgba(224, 230, 255, 0.72);
        font-size: 11px;
        font-weight: 700;
      }

      .causal-branch-filters input,
      .causal-branch-filters select {
        min-width: 0;
        min-height: 36px;
        padding: 6px 8px;
        border: 1px solid rgba(224, 207, 255, 0.34);
        border-radius: 7px;
        color: #ffffff;
        background: rgba(29, 16, 47, 0.94);
        font: inherit;
      }

      .causal-ledger-table th {
        color: rgba(224, 230, 255, 0.68);
        font-weight: 760;
      }

      .causal-ledger-table tr[data-selected="true"],
      .causal-ledger-table tr[data-branch-status="accepted"] {
        background: rgba(74, 229, 255, 0.06);
      }

      .causal-ledger-table tr[data-branch-status="rejected"] {
        background: rgba(255, 150, 166, 0.06);
      }

      .causal-ledger-table tr[data-branch-status="filtered"] {
        opacity: 0.72;
      }

      .causal-ledger-button {
        min-height: 28px;
        padding: 0 7px;
        white-space: nowrap;
      }

      .causal-roots-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .causal-delay-map {
        grid-column: 1 / -1;
        margin: 0;
        padding: 8px;
        border: 1px solid rgba(224, 207, 255, 0.18);
        border-radius: 8px;
        background: rgba(15, 8, 27, 0.72);
      }

      .causal-delay-map svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .causal-delay-map figcaption {
        color: rgba(224, 230, 255, 0.68);
        font-size: 11px;
      }

      .causal-delay-map-axis {
        stroke: rgba(246, 247, 255, 0.34);
        stroke-width: 1;
      }

      .causal-delay-map-line {
        fill: none;
        stroke: #7feeff;
        stroke-width: 2;
      }

      .causal-delay-map-root {
        fill: #ffffff;
        stroke: #7feeff;
        stroke-width: 2;
      }

      .causal-metric-card,
      .causal-state-card {
        display: grid;
        gap: 4px;
        min-width: 0;
        padding: 9px;
        border: 1px solid rgba(224, 207, 255, 0.18);
        border-radius: 8px;
        background: rgba(36, 20, 55, 0.58);
      }

      .causal-metric-card span {
        color: rgba(224, 230, 255, 0.62);
        font-size: 10px;
        text-transform: uppercase;
      }

      .causal-metric-card strong,
      .causal-state-card strong {
        color: #ffffff;
        font-size: 16px;
      }

      .causal-state-card code {
        color: rgba(236, 240, 255, 0.72);
        font-size: 11px;
        overflow-wrap: anywhere;
      }

      .causal-state-card h3 {
        margin: 0;
        font-size: 15px;
      }

      .causal-state-card[data-selected="true"] {
        box-shadow: 0 0 0 2px rgba(127, 238, 255, 0.72);
      }

      .causal-state-card[data-root-state="active"] {
        border-color: rgba(122, 255, 183, 0.54);
      }

      .causal-state-card[data-root-state="failed-floor"],
      .causal-state-card[data-root-state="unresolved"] {
        border-color: rgba(255, 218, 89, 0.54);
      }

      .causal-guided-controls {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
      }

      .causal-guided-button {
        padding: 0 7px;
      }

      .causal-canvas-summary {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .is-guided-mode .causal-toolbar,
      .is-guided-mode .causal-settings,
      .is-guided-mode .causal-readout {
        display: none;
      }

      .is-sandbox-mode .causal-mode-tabs {
        top: max(68px, calc(env(safe-area-inset-top) + 68px));
      }

      @media (max-width: 820px) {
        .causal-toolbar {
          right: max(12px, env(safe-area-inset-right));
          left: max(12px, env(safe-area-inset-left));
          flex-wrap: wrap;
        }

        .causal-title {
          flex: 1 1 100%;
        }

        .causal-switch-row {
          flex: 1 1 100%;
          max-width: none;
        }

        .causal-now-scrub {
          flex: 1 1 180px;
          grid-template-columns: minmax(118px, 1fr) 48px;
        }

        .causal-legend {
          flex: 1 1 100%;
          max-width: none;
        }

        .causal-settings {
          top: max(118px, calc(env(safe-area-inset-top) + 118px));
          right: max(12px, env(safe-area-inset-right));
          left: auto;
        }

        .causal-readout {
          right: max(12px, env(safe-area-inset-right));
          left: max(12px, env(safe-area-inset-left));
          flex-wrap: wrap;
        }

        .causal-mode-tabs {
          right: 12px;
          left: 12px;
          width: auto;
          transform: none;
        }

        .causal-lesson-panel {
          top: auto;
          right: max(12px, env(safe-area-inset-right));
          bottom: max(12px, env(safe-area-inset-bottom));
          left: max(12px, env(safe-area-inset-left));
          width: auto;
          max-height: 47vh;
          padding: 13px;
        }

        .causal-lesson-panel h1 {
          font-size: 20px;
        }

        .causal-guided-controls {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .causal-roots-grid {
          grid-template-columns: 1fr;
        }

        .causal-delay-map {
          grid-column: 1;
        }

        .is-sandbox-mode .causal-mode-tabs {
          top: max(198px, calc(env(safe-area-inset-top) + 198px));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }

      @media (forced-colors: active) {
        .causal-mode-tab,
        .causal-guided-button,
        .causal-choice-button,
        .causal-ledger-button,
        .causal-lesson-panel,
        .causal-mode-tabs {
          border: 1px solid CanvasText;
          forced-color-adjust: auto;
        }
      }
    </style>
  </head>
  <body>
    <main id="causal-delay-feedback-app">
      <canvas
        id="causal-delay-feedback-canvas"
        tabindex="0"
        aria-label="Causal delay feedback replay canvas"
        aria-describedby="causal-delay-feedback-canvas-summary"
      ></canvas>

      <section id="causal-delay-feedback-journey" class="causal-journey" aria-label="Causal delay learning journey">
        <nav id="causal-delay-feedback-mode-tabs" class="causal-mode-tabs" aria-label="Learning stages"></nav>
        <section id="causal-delay-feedback-lesson-panel" class="causal-lesson-panel" aria-labelledby="causal-delay-feedback-lesson-title">
          <div id="causal-delay-feedback-lesson-meta" class="causal-lesson-meta"></div>
          <h1 id="causal-delay-feedback-lesson-title">Story</h1>
          <p id="causal-delay-feedback-lesson-body" class="causal-lesson-body"></p>
          <div id="causal-delay-feedback-lesson-content" class="causal-lesson-content"></div>
          <p id="causal-delay-feedback-lesson-status" class="causal-lesson-status" role="status" aria-live="polite"></p>
          <div class="causal-guided-controls" aria-label="Guided lesson controls">
            <button id="causal-delay-feedback-guided-back" class="causal-guided-button" type="button" data-guided-action="back">Back</button>
            <button id="causal-delay-feedback-guided-play" class="causal-guided-button" type="button" data-guided-action="play" aria-pressed="false">Play</button>
            <button id="causal-delay-feedback-guided-next" class="causal-guided-button" type="button" data-guided-action="next">Next</button>
            <button id="causal-delay-feedback-guided-replay" class="causal-guided-button" type="button" data-guided-action="replay">Replay</button>
            <button id="causal-delay-feedback-guided-sandbox" class="causal-guided-button" type="button" data-guided-action="sandbox">Sandbox</button>
          </div>
        </section>
        <p id="causal-delay-feedback-canvas-summary" class="causal-canvas-summary" aria-live="polite"></p>
      </section>

      <div class="causal-toolbar" aria-label="Causal delay feedback controls">
        <div class="causal-title">
          <strong>Causal Delay Feedback</strong>
        </div>

        <div
          id="causal-delay-feedback-visual-switches"
          class="causal-switch-row"
          aria-label="Wake visual switches"
        >
          <button
            class="causal-switch-button"
            type="button"
            data-visual-switch="arcWakesEnabled"
            aria-pressed="true"
            aria-label="Arc wakes"
            title="Arc wakes"
          >Arcs</button>
          <button
            class="causal-switch-button"
            type="button"
            data-visual-switch="fullCircularWakesEnabled"
            aria-pressed="false"
            aria-label="Full circular wakes"
            title="Full circular wakes"
          >Full</button>
        </div>

        <button
          id="causal-delay-feedback-play"
          class="causal-icon-button"
          type="button"
          aria-label="Play replay"
          title="Play replay"
          data-tooltip="Play replay"
        ></button>

        <div class="causal-now-scrub">
          <input
            id="causal-delay-feedback-now"
            class="causal-range"
            type="range"
            min="0"
            max="1000"
            step="1"
            value="0"
            aria-label="Replay now"
          />
          <output id="causal-delay-feedback-now-value" class="causal-now-value">replay t=0.00</output>
        </div>

        <button
          id="causal-delay-feedback-reset"
          class="causal-icon-button"
          type="button"
          aria-label="Reset replay"
          title="Reset replay"
          data-tooltip="Reset replay"
        ></button>

        <button
          id="causal-delay-feedback-settings"
          class="causal-icon-button"
          type="button"
          aria-expanded="false"
          aria-controls="causal-delay-feedback-settings-panel"
          aria-label="Canvas settings"
          title="Canvas settings"
          data-tooltip="Canvas settings"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.72l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>

        <div class="causal-legend" aria-label="Visual legend">
          <span class="causal-legend-chip"><span class="causal-legend-line" aria-hidden="true"></span>solid paths</span>
          <span class="causal-legend-chip">
            <span class="causal-legend-dots" aria-hidden="true">
              <i></i><i></i><i></i><i></i><i></i>
            </span>
            dotted wakes
          </span>
        </div>
      </div>

      <span
        id="causal-delay-feedback-replay-status"
        class="causal-source-chip"
        data-state="representative"
        hidden
      >representative replay</span>

      <div
        id="causal-delay-feedback-settings-panel"
        class="causal-settings"
        role="dialog"
        aria-label="Settings"
        hidden
      >
        <div class="causal-settings-label">Canvas</div>
        <div class="causal-swatch-row" id="causal-delay-feedback-color-swatches"></div>
        <div class="causal-settings-label">Architrino speed</div>
        <div class="causal-slider-row has-step-buttons">
          <button
            class="causal-step-button"
            type="button"
            data-architrino-speed-step="-1"
            aria-label="Decrease architrino speed"
          >&lt;</button>
          <input
            id="causal-delay-feedback-architrino-speed"
            class="causal-range"
            type="range"
            min="0"
            max="9"
            step="1"
            value="3"
            aria-label="Architrino speed as a fraction of field speed c_f"
          />
          <button
            class="causal-step-button"
            type="button"
            data-architrino-speed-step="1"
            aria-label="Increase architrino speed"
          >&gt;</button>
          <output id="causal-delay-feedback-architrino-speed-value" class="causal-speed-value">0.7 c<sub>f</sub></output>
        </div>
        <div class="causal-settings-label">Animation speed</div>
        <div class="causal-slider-row">
          <div class="causal-range-wrap">
            <input
              id="causal-delay-feedback-cf-speed"
              class="causal-range"
              type="range"
              min="0.25"
              max="1.75"
              step="0.05"
              value="1"
              aria-label="Animation speed"
            />
            <span class="causal-range-midpoint" aria-hidden="true">1</span>
          </div>
          <output id="causal-delay-feedback-cf-speed-value" class="causal-speed-value">1x</output>
        </div>
        <button
          id="causal-delay-feedback-reset-preset"
          class="causal-settings-action"
          type="button"
        >
          Reset preset
        </button>
      </div>

      <div id="causal-delay-feedback-readout" class="causal-readout" aria-live="polite" hidden></div>
    </main>

    <script type="module" src="./src/apps/causal-delay-feedback/main.js"></script>
  </body>
</html>
