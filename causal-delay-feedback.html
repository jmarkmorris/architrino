<!doctype html>
<html lang="en" data-causal-input-modality="pointer">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4b0082" />
    <title>Causal Delay Feedback</title>
    <link rel="stylesheet" href="./ui-tokens.css" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #4b0082;
        color: #f6f7ff;
        font-family: var(--ui-font-family);
      }

      button,
      input,
      select {
        font: inherit;
      }

      #causal-delay-feedback-app {
        position: relative;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: #4b0082;
      }

      #causal-delay-feedback-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }

      .causal-toolbar {
        position: absolute;
        top: max(20px, env(safe-area-inset-top));
        right: max(20px, env(safe-area-inset-right));
        left: max(20px, env(safe-area-inset-left));
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid rgba(224, 207, 255, 0.34);
        border-radius: 8px;
        background: rgba(6, 6, 12, 0.84);
        box-shadow: 0 18px 36px rgba(12, 4, 24, 0.24);
        backdrop-filter: blur(10px);
      }

      .causal-title {
        min-width: 0;
        white-space: nowrap;
      }

      .causal-title strong {
        display: block;
        color: #ffffff;
        font-size: 20px;
        font-weight: 780;
        line-height: 1;
        letter-spacing: 0;
      }

      .causal-switch-row {
        display: flex;
        flex: 0 0 auto;
        flex-wrap: wrap;
        gap: 6px;
      }

      .causal-switch-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 52px;
        height: 30px;
        padding: 0 9px;
        border: 1px solid rgba(224, 207, 255, 0.3);
        border-radius: 6px;
        background: rgba(36, 20, 55, 0.72);
        color: rgba(246, 247, 255, 0.74);
        cursor: pointer;
        font-size: 11px;
        font-weight: 780;
        line-height: 1;
        white-space: nowrap;
      }

      .causal-switch-button[aria-pressed="true"] {
        border-color: rgba(74, 229, 255, 0.72);
        background: rgba(38, 76, 90, 0.72);
        color: #f6f7ff;
      }

      .causal-source-chip {
        display: inline-flex;
        align-items: center;
        margin-left: auto;
        height: 26px;
        max-width: 190px;
        padding: 0 9px;
        border: 1px solid rgba(224, 207, 255, 0.28);
        border-radius: 6px;
        background: rgba(34, 18, 54, 0.74);
        color: rgba(224, 230, 255, 0.76);
        font-size: 11px;
        font-weight: 760;
        line-height: 1;
        white-space: nowrap;
      }

      .causal-source-chip[hidden] {
        display: none;
      }

      .causal-source-chip[data-state="loading"] {
        border-color: rgba(255, 218, 89, 0.54);
        color: rgba(255, 235, 145, 0.94);
      }

      .causal-source-chip[data-state="bridge"] {
        border-color: rgba(74, 229, 255, 0.54);
        color: rgba(148, 239, 255, 0.94);
      }

      .causal-source-chip[data-state="bridge-seed"] {
        border-color: rgba(74, 229, 255, 0.48);
        color: rgba(255, 235, 145, 0.94);
      }

      .causal-source-chip[data-state="fallback"] {
        border-color: rgba(255, 150, 166, 0.52);
        color: rgba(255, 186, 198, 0.94);
      }

      .causal-source-chip[data-state="draft"] {
        border-color: rgba(255, 218, 89, 0.54);
        color: rgba(255, 235, 145, 0.94);
      }

      .causal-now-scrub {
        display: block;
        width: 100%;
        min-width: 0;
      }

      .causal-bottom-rail {
        position: absolute;
        right: max(20px, env(safe-area-inset-right));
        bottom: max(20px, env(safe-area-inset-bottom));
        left: max(20px, env(safe-area-inset-left));
        z-index: 2;
        display: grid;
        grid-template-columns: auto auto auto minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        min-width: 0;
        padding: 10px 12px 8px;
        border: 1px solid rgba(224, 207, 255, 0.34);
        border-radius: 8px;
        background: rgba(6, 6, 12, 0.84);
        box-shadow: 0 18px 36px rgba(12, 4, 24, 0.24);
        backdrop-filter: blur(10px);
      }

      .causal-switch-button:hover,
      .causal-switch-button:focus-visible {
        border-color: rgba(246, 247, 255, 0.72);
        outline: none;
      }

      .causal-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        max-width: min(360px, 28vw);
        pointer-events: none;
      }

      .causal-legend-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 30px;
        padding: 6px 10px;
        border: 1px solid var(--causal-legend-border-color, rgba(224, 207, 255, 0.28));
        border-radius: 6px;
        background: var(--causal-selected-canvas-color, #4b0082);
        color: var(--causal-legend-text-color, rgba(246, 247, 255, 0.86));
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
        backdrop-filter: blur(8px);
      }

      .causal-legend-line {
        width: 34px;
        height: 22px;
        position: relative;
      }

      .causal-legend-line::before,
      .causal-legend-line::after {
        position: absolute;
        left: 0;
        right: 0;
        height: 5px;
        border-radius: 999px;
        content: "";
      }

      .causal-legend-line::before {
        top: 3px;
        background: var(--causal-positrino-color, #ff0000);
      }

      .causal-legend-line::after {
        bottom: 3px;
        background: var(--causal-electrino-color, #0000ff);
      }

      .causal-legend-dots {
        position: relative;
        width: 34px;
        height: 18px;
        flex: 0 0 34px;
      }

      .causal-legend-dots i {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 999px;
        background: var(--causal-positrino-wake-color, #ff96a6);
      }

      .causal-legend-dots i:nth-child(even) {
        background: var(--causal-electrino-wake-color, #96aaff);
      }

      .causal-legend-dots i:nth-child(1) {
        left: 1px;
        top: 12px;
      }

      .causal-legend-dots i:nth-child(2) {
        left: 8px;
        top: 7px;
      }

      .causal-legend-dots i:nth-child(3) {
        left: 16px;
        top: 5px;
      }

      .causal-legend-dots i:nth-child(4) {
        left: 24px;
        top: 7px;
      }

      .causal-legend-dots i:nth-child(5) {
        left: 31px;
        top: 12px;
      }

      .causal-math-label {
        display: inline-flex;
        align-items: baseline;
        gap: 1px;
      }

      .causal-math-label sub {
        font-size: 0.68em;
        line-height: 0;
      }

      .causal-range {
        height: 18px;
        width: 100%;
        accent-color: #f6f7ff;
        appearance: none;
        background: transparent;
        cursor: pointer;
      }

      .causal-range::-webkit-slider-runnable-track {
        height: 4px;
        border: 1px solid rgba(224, 207, 255, 0.18);
        border-radius: 999px;
        background: rgba(246, 247, 255, 0.34);
        box-shadow: inset 0 0 0 1px rgba(6, 6, 12, 0.42);
      }

      .causal-range::-webkit-slider-thumb {
        width: 16px;
        height: 16px;
        margin-top: -7px;
        border: 1px solid rgba(246, 247, 255, 0.88);
        border-radius: 999px;
        appearance: none;
        background: #f6f7ff;
        box-shadow:
          0 0 0 3px rgba(246, 247, 255, 0.14),
          0 2px 8px rgba(0, 0, 0, 0.32);
      }

      .causal-range::-moz-range-track {
        height: 4px;
        border: 1px solid rgba(224, 207, 255, 0.18);
        border-radius: 999px;
        background: rgba(246, 247, 255, 0.34);
        box-shadow: inset 0 0 0 1px rgba(6, 6, 12, 0.42);
      }

      .causal-range::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border: 1px solid rgba(246, 247, 255, 0.88);
        border-radius: 999px;
        background: #f6f7ff;
        box-shadow:
          0 0 0 3px rgba(246, 247, 255, 0.14),
          0 2px 8px rgba(0, 0, 0, 0.32);
      }

      .causal-range:focus-visible {
        outline: 2px solid rgba(246, 247, 255, 0.76);
        outline-offset: 4px;
      }

      .causal-timeline-range {
        accent-color: #8b4fbf;
      }

      .causal-timeline-range::-webkit-slider-runnable-track {
        border-color: rgba(225, 205, 255, 0.46);
        background: #7a36aa;
      }

      .causal-timeline-range::-webkit-slider-thumb {
        border: 0;
        background: #8b4fbf;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.42);
      }

      .causal-timeline-range::-moz-range-track {
        border-color: rgba(225, 205, 255, 0.46);
        background: #7a36aa;
      }

      .causal-timeline-range::-moz-range-thumb {
        border: 0;
        background: #8b4fbf;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.42);
      }

      .causal-timeline-range:focus-visible {
        outline: none;
      }

      html[data-causal-input-modality="keyboard"]
        .causal-timeline-range:focus::-webkit-slider-thumb {
        box-shadow:
          0 0 0 3px rgba(225, 205, 255, 0.96),
          0 2px 8px rgba(0, 0, 0, 0.42);
      }

      html[data-causal-input-modality="keyboard"]
        .causal-timeline-range:focus::-moz-range-thumb {
        box-shadow:
          0 0 0 3px rgba(225, 205, 255, 0.96),
          0 2px 8px rgba(0, 0, 0, 0.42);
      }


      .causal-readout {
        display: none;
      }

      .causal-readout[hidden] {
        display: none;
      }

      .causal-readout strong {
        color: #ffffff;
        font-size: 13px;
        font-weight: 780;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .causal-readout span {
        color: rgba(224, 230, 255, 0.78);
        white-space: nowrap;
      }

      #causal-delay-feedback-boot-error {
        position: absolute;
        right: 16px;
        bottom: 16px;
        z-index: 5;
        max-width: min(420px, calc(100vw - 32px));
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 8px;
        background: rgba(6, 6, 12, 0.88);
        color: #ffffff;
        font-size: 13px;
        font-weight: 700;
      }

      .causal-journey {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
      }

      .causal-app-icon-strip {
        position: absolute;
        top: max(16px, env(safe-area-inset-top));
        right: max(16px, env(safe-area-inset-right));
        z-index: 2;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        pointer-events: auto;
      }

      .causal-app-icon-strip button {
        font: inherit;
      }

      .causal-app-icon-button {
        width: 32px;
        height: 32px;
        padding: 0;
        border: 1px solid rgba(160, 170, 220, 0.25);
        border-radius: 999px;
        background: rgba(8, 10, 18, 0.75);
        color: #f5f7ff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .causal-app-icon-button svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .causal-app-icon-button:not(:disabled):hover,
      .causal-app-icon-button:not(:disabled):focus-visible,
      #textbook-toc-button:not(:disabled):hover,
      #textbook-toc-button:not(:disabled):focus-visible {
        border-color: rgba(213, 220, 255, 0.6);
        outline: none;
      }

      .causal-app-icon-button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      /* Keep the global TOC lozenge visually identical to the site shell. */
      #textbook-toc-button {
        position: relative;
        min-width: 48px;
        height: 32px;
        padding: 0 12px;
        border: 1px solid rgba(160, 170, 220, 0.25);
        border-radius: 999px;
        background: rgba(8, 10, 18, 0.75);
        color: #f5f7ff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        line-height: 1;
        text-transform: uppercase;
      }

      #textbook-toc-button::after {
        content: none;
        display: none;
      }

      #textbook-toc-button.is-active {
        background: rgba(92, 36, 164, 0.92);
        border-color: rgba(176, 136, 255, 0.7);
      }

      .causal-lesson-nav-history {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0;
        border: none;
        background: transparent;
      }

      .causal-scene-search {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        pointer-events: auto;
      }

      .causal-scene-search-toggle.is-active {
        background: rgba(92, 36, 164, 0.92);
        border-color: rgba(176, 136, 255, 0.7);
      }

      .causal-scene-search-panel {
        position: absolute;
        top: 44px;
        right: 0;
        z-index: 7;
        display: none;
        min-width: 260px;
        max-width: 80vw;
        padding: 10px;
        border: 1px solid rgba(160, 170, 220, 0.25);
        border-radius: 8px;
        background: rgba(8, 10, 18, 0.94);
      }

      .causal-scene-search-panel.is-open {
        display: block;
      }

      .causal-scene-search-input {
        width: 100%;
        min-height: 32px;
        padding: 6px 8px;
        border: 1px solid rgba(160, 170, 220, 0.25);
        border-radius: 6px;
        background: rgba(15, 18, 32, 0.9);
        color: #f5f7ff;
      }

      .causal-scene-search-results {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 220px;
        margin-top: 8px;
        overflow: auto;
      }

      .causal-app-icon-strip .scene-search-item {
        padding: 6px 8px;
        border: 1px solid rgba(160, 170, 220, 0.25);
        border-radius: 8px;
        background: rgba(15, 18, 32, 0.8);
        color: #f5f7ff;
        text-align: left;
        font-family: var(--ui-font-family);
        font-size: var(--ui-label-size);
        font-weight: var(--ui-label-weight);
        line-height: var(--ui-label-line-height);
        cursor: pointer;
      }

      .causal-app-icon-strip .scene-search-item:hover,
      .causal-app-icon-strip .scene-search-item:focus-visible {
        border-color: rgba(213, 220, 255, 0.6);
      }

      .causal-mode-tabs {
        position: absolute;
        top: max(60px, calc(env(safe-area-inset-top) + 60px));
        right: max(16px, env(safe-area-inset-right));
        display: block;
        width: min(430px, calc(100vw - 32px));
        max-height: min(520px, calc(100vh - 80px));
        padding: 6px;
        overflow-y: auto;
        border: 1px solid rgba(224, 207, 255, 0.34);
        border-radius: 8px;
        background: rgba(6, 6, 12, 0.88);
        box-shadow: 0 18px 36px rgba(12, 4, 24, 0.24);
        pointer-events: auto;
        scrollbar-color: rgba(224, 207, 255, 0.62) rgba(36, 20, 55, 0.72);
        scrollbar-width: thin;
        backdrop-filter: blur(12px);
      }

      .causal-mode-tabs::-webkit-scrollbar {
        width: 8px;
      }

      .causal-mode-tabs::-webkit-scrollbar-track {
        border-radius: 999px;
        background: rgba(36, 20, 55, 0.72);
      }

      .causal-mode-tabs::-webkit-scrollbar-thumb {
        border-radius: 999px;
        background: rgba(224, 207, 255, 0.62);
      }

      .causal-mode-tabs[hidden] {
        display: none;
      }

      .causal-journey.is-global-search-open .causal-mode-tabs {
        top: max(354px, calc(env(safe-area-inset-top) + 354px));
        max-height: min(250px, calc(100vh - 370px));
      }

      .causal-lesson-toc-list {
        display: grid;
        gap: 4px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .causal-mode-tab,
      .causal-guided-button,
      .causal-choice-button,
      .causal-ledger-button {
        min-height: 32px;
        border: 1px solid rgba(224, 207, 255, 0.3);
        border-radius: 6px;
        background: rgba(36, 20, 55, 0.9);
        color: rgba(246, 247, 255, 0.9);
        cursor: pointer;
        font-family: var(--ui-font-family);
        font-size: var(--ui-label-size);
        font-weight: var(--ui-label-weight);
        line-height: var(--ui-label-line-height);
      }

      .causal-mode-tab {
        width: 100%;
        min-height: 36px;
        padding: 7px 10px;
        text-align: left;
      }

      .causal-mode-tab[aria-current="step"] {
        border-color: rgba(74, 229, 255, 0.74);
        background: rgba(38, 76, 90, 0.78);
        color: #ffffff;
      }

      .causal-mode-tab[data-causal-preview] {
        border-color: rgba(188, 192, 207, 0.26);
        background: rgba(42, 42, 50, 0.82);
        color: rgba(214, 216, 225, 0.68);
        opacity: 1;
      }

      .causal-mode-tab:hover,
      .causal-mode-tab:focus-visible,
      .causal-guided-button:hover,
      .causal-guided-button:focus-visible,
      .causal-choice-button:hover,
      .causal-choice-button:focus-visible,
      .causal-ledger-button:hover,
      .causal-ledger-button:focus-visible {
        border-color: rgba(246, 247, 255, 0.78);
        outline: 2px solid rgba(74, 229, 255, 0.48);
        outline-offset: 1px;
      }

      .causal-mode-tab:disabled,
      .causal-guided-button:disabled,
      .causal-ledger-button:disabled {
        cursor: not-allowed;
        opacity: 0.4;
      }

      .causal-lesson-panel {
        position: absolute;
        top: max(70px, calc(env(safe-area-inset-top) + 70px));
        left: max(18px, env(safe-area-inset-left));
        display: grid;
        gap: 10px;
        width: min(410px, calc(100vw - 36px));
        max-height: calc(100vh - 94px);
        padding: 16px;
        overflow: auto;
        border: 1px solid rgba(224, 207, 255, 0.34);
        border-radius: 12px;
        background: rgba(6, 6, 12, 0.9);
        box-shadow: 0 22px 46px rgba(8, 2, 20, 0.38);
        pointer-events: auto;
        backdrop-filter: blur(14px);
      }

      .causal-journey[data-mode="story"] .causal-lesson-panel {
        width: min(640px, calc(100vw - 36px));
      }

      .causal-journey[data-mode="story"] .causal-event-readout {
        grid-template-columns: max-content minmax(0, 1fr);
      }

      .causal-journey[data-mode="story"] .causal-event-readout dd {
        white-space: nowrap;
      }

      .causal-lesson-panel[hidden] {
        display: none;
      }

      .causal-lesson-meta {
        color: #7feeff;
        font-size: 11px;
        font-weight: 780;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .causal-lesson-panel h1 {
        margin: 0;
        color: #ffffff;
        font-size: 24px;
        line-height: 1.12;
      }

      .causal-lesson-body,
      .causal-lesson-status,
      .causal-fold-note,
      .causal-vector-sum,
      .causal-state-card p {
        margin: 0;
        color: rgba(236, 240, 255, 0.84);
        font-size: 14px;
        line-height: 1.48;
      }

      .causal-lesson-status {
        padding: 9px 10px;
        border-left: 3px solid #7feeff;
        background: rgba(74, 229, 255, 0.08);
      }

      .causal-lesson-content {
        display: grid;
        gap: 10px;
        min-width: 0;
      }

      .causal-story-speed-selector {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
      }

      .causal-story-speed-label {
        flex: 1 0 100%;
        color: rgba(224, 230, 255, 0.66);
        font-size: 11px;
        font-weight: 760;
        letter-spacing: 0.03em;
      }

      .causal-story-speed-button {
        min-width: 76px;
        min-height: 34px;
        padding: 6px 10px;
        border: 1px solid rgba(224, 207, 255, 0.34);
        border-radius: 999px;
        background: rgba(74, 39, 102, 0.62);
        color: rgba(246, 247, 255, 0.82);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        font-weight: 760;
      }

      .causal-story-speed-button[aria-pressed="true"] {
        border-color: rgba(255, 150, 166, 0.9);
        background: rgba(255, 0, 0, 0.22);
        color: #ffffff;
      }

      .causal-story-speed-button:hover,
      .causal-story-speed-button:focus-visible {
        border-color: rgba(246, 247, 255, 0.78);
        outline: 2px solid rgba(255, 150, 166, 0.42);
        outline-offset: 1px;
      }

      .causal-event-readout {
        display: grid;
        grid-template-columns: minmax(120px, 1fr) 1fr;
        gap: 5px 10px;
        margin: 0;
        font-size: 12px;
      }

      .causal-event-readout dt {
        color: rgba(224, 230, 255, 0.62);
      }

      .causal-event-readout dd {
        margin: 0;
        color: #ffffff;
        font-weight: 700;
        text-align: right;
      }

      .causal-choice-button {
        min-height: 42px;
        padding: 8px 10px;
        text-align: left;
      }

      .causal-ledger-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
        line-height: 1.3;
      }

      .causal-ledger-table th,
      .causal-ledger-table td {
        padding: 7px 6px;
        border-bottom: 1px solid rgba(224, 207, 255, 0.16);
        overflow-wrap: anywhere;
        text-align: left;
        vertical-align: top;
      }

      .causal-vector-sum {
        overflow-wrap: anywhere;
      }

      .causal-ledger-table th {
        color: rgba(224, 230, 255, 0.68);
        font-weight: 760;
      }

      .causal-ledger-table tr[data-selected="true"],
      .causal-ledger-table tr[data-branch-status="accepted"] {
        background: rgba(74, 229, 255, 0.06);
      }

      .causal-ledger-table tr[data-branch-status="rejected"] {
        background: rgba(255, 150, 166, 0.06);
      }

      .causal-ledger-table tr[data-branch-status="filtered"] {
        opacity: 0.72;
      }

      .causal-ledger-button {
        min-height: 28px;
        padding: 0 7px;
        white-space: nowrap;
      }

      .causal-roots-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .causal-delay-map {
        grid-column: 1 / -1;
        margin: 0;
        padding: 8px;
        border: 1px solid rgba(224, 207, 255, 0.18);
        border-radius: 8px;
        background: rgba(15, 8, 27, 0.72);
      }

      .causal-delay-map svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .causal-delay-map figcaption {
        color: rgba(224, 230, 255, 0.68);
        font-size: 11px;
      }

      .causal-delay-map-axis {
        stroke: rgba(246, 247, 255, 0.34);
        stroke-width: 1;
      }

      .causal-delay-map-line {
        fill: none;
        stroke: #7feeff;
        stroke-width: 2;
      }

      .causal-delay-map-root {
        fill: #ffffff;
        stroke: #7feeff;
        stroke-width: 2;
      }

      .causal-metric-card,
      .causal-state-card {
        display: grid;
        gap: 4px;
        min-width: 0;
        padding: 9px;
        border: 1px solid rgba(224, 207, 255, 0.18);
        border-radius: 8px;
        background: rgba(36, 20, 55, 0.58);
      }

      .causal-metric-card span {
        color: rgba(224, 230, 255, 0.62);
        font-size: 10px;
        text-transform: uppercase;
      }

      .causal-metric-card strong,
      .causal-state-card strong {
        color: #ffffff;
        font-size: 16px;
      }

      .causal-state-card code {
        color: rgba(236, 240, 255, 0.72);
        font-size: 11px;
        overflow-wrap: anywhere;
      }

      .causal-state-card h3 {
        margin: 0;
        font-size: 15px;
      }

      .causal-state-card[data-selected="true"] {
        box-shadow: 0 0 0 2px rgba(127, 238, 255, 0.72);
      }

      .causal-state-card[data-root-state="active"] {
        border-color: rgba(122, 255, 183, 0.54);
      }

      .causal-state-card[data-root-state="failed-floor"],
      .causal-state-card[data-root-state="unresolved"] {
        border-color: rgba(255, 218, 89, 0.54);
      }

      .causal-guided-controls {
        display: contents;
      }

      .causal-guided-button {
        display: inline-grid;
        min-width: 34px;
        min-height: 34px;
        padding: 0 8px;
        place-items: center;
      }

      .causal-guided-button svg {
        width: 18px;
        height: 18px;
      }

      .causal-canvas-summary {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .is-guided-mode .causal-toolbar,
      .is-guided-mode .causal-readout {
        display: none;
      }

      .is-sandbox-mode .causal-mode-tabs {
        top: max(60px, calc(env(safe-area-inset-top) + 60px));
      }

      @media (min-width: 1200px) {
        .is-sandbox-mode .causal-toolbar {
          right: max(466px, calc(env(safe-area-inset-right) + 466px));
        }
      }

      @media (min-width: 821px) and (max-width: 1199px) {
        .is-sandbox-mode .causal-toolbar {
          top: max(60px, calc(env(safe-area-inset-top) + 60px));
        }

        .is-sandbox-mode .causal-mode-tabs {
          top: max(128px, calc(env(safe-area-inset-top) + 128px));
        }
      }

      @media (min-width: 1380px) {
        .causal-mode-tabs {
          right: max(18px, env(safe-area-inset-right));
        }

        .causal-lesson-panel {
          top: max(12px, env(safe-area-inset-top));
          left: max(12px, env(safe-area-inset-left));
          max-height: calc(100vh - 24px);
        }

      }

      @media (max-width: 820px) {
        .causal-toolbar {
          right: max(12px, env(safe-area-inset-right));
          left: max(12px, env(safe-area-inset-left));
          flex-wrap: wrap;
        }

        .causal-title {
          flex: 1 1 100%;
        }

        .causal-switch-row {
          flex: 1 1 100%;
          max-width: none;
        }

        .causal-bottom-rail {
          right: max(12px, env(safe-area-inset-right));
          bottom: max(12px, env(safe-area-inset-bottom));
          left: max(12px, env(safe-area-inset-left));
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .causal-bottom-rail .causal-now-scrub {
          grid-row: 2;
          grid-column: 1 / -1;
        }

        .causal-legend {
          flex: 1 1 100%;
          max-width: none;
        }

        .causal-readout {
          right: max(12px, env(safe-area-inset-right));
          left: max(12px, env(safe-area-inset-left));
          flex-wrap: wrap;
        }

        .causal-mode-tabs {
          top: max(56px, calc(env(safe-area-inset-top) + 56px));
          right: 12px;
          left: 12px;
          width: auto;
          max-height: min(390px, calc(100vh - 104px));
        }

        .causal-lesson-toc-list {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .causal-lesson-panel {
          top: auto;
          right: max(12px, env(safe-area-inset-right));
          bottom: max(104px, calc(env(safe-area-inset-bottom) + 104px));
          left: max(12px, env(safe-area-inset-left));
          width: auto;
          max-height: 47vh;
          padding: 13px;
        }

        .causal-journey[data-mode="story"] .causal-lesson-panel {
          top: auto;
          right: max(12px, env(safe-area-inset-right));
          bottom: max(104px, calc(env(safe-area-inset-bottom) + 104px));
          left: max(12px, env(safe-area-inset-left));
          width: auto;
          max-height: 47vh;
          padding: 13px;
        }

        .causal-journey[data-mode="story"] .causal-event-readout {
          grid-template-columns: minmax(120px, 1fr) 1fr;
        }

        .causal-journey[data-mode="story"] .causal-event-readout dd {
          white-space: normal;
        }

        .causal-lesson-panel h1 {
          font-size: 20px;
        }

        .causal-guided-controls {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .causal-roots-grid {
          grid-template-columns: 1fr;
        }

        .causal-delay-map {
          grid-column: 1;
        }

        .is-sandbox-mode .causal-mode-tabs {
          top: max(198px, calc(env(safe-area-inset-top) + 198px));
        }

        .is-sandbox-mode .causal-toolbar {
          top: max(56px, calc(env(safe-area-inset-top) + 56px));
        }

        .causal-app-icon-strip {
          top: max(12px, env(safe-area-inset-top));
          right: max(12px, env(safe-area-inset-right));
        }
      }

      /* Laboratory keeps the same top-left panel treatment as Story. */
      .is-sandbox-mode .causal-toolbar {
        top: max(70px, calc(env(safe-area-inset-top) + 70px));
        right: auto;
        left: max(18px, env(safe-area-inset-left));
        width: min(640px, calc(100vw - 36px));
        padding: 16px;
        border-radius: 12px;
        background: rgba(6, 6, 12, 0.9);
        box-shadow: 0 22px 46px rgba(8, 2, 20, 0.38);
      }

      .is-sandbox-mode .causal-toolbar .causal-title strong {
        font-size: 24px;
        line-height: 1.12;
      }

      .is-sandbox-mode .causal-toolbar .causal-switch-button {
        min-width: 76px;
        height: 34px;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 760;
      }

      @media (min-width: 1380px) {
        .is-sandbox-mode .causal-toolbar {
          top: max(12px, calc(env(safe-area-inset-top) + 12px));
          left: max(12px, env(safe-area-inset-left));
        }
      }

      @media (max-width: 820px) {
        .is-sandbox-mode .causal-toolbar {
          top: max(56px, calc(env(safe-area-inset-top) + 56px));
          right: max(12px, env(safe-area-inset-right));
          left: max(12px, env(safe-area-inset-left));
          width: auto;
          padding: 13px;
        }

        .is-sandbox-mode .causal-toolbar .causal-title strong {
          font-size: 20px;
          line-height: 1.12;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }

      @media (forced-colors: active) {
        .causal-mode-tab,
        .causal-guided-button,
        .causal-choice-button,
        .causal-ledger-button,
        .causal-lesson-panel,
        .causal-mode-tabs {
          border: 1px solid CanvasText;
          forced-color-adjust: auto;
        }
      }
    </style>
  </head>
  <body>
    <main id="causal-delay-feedback-app">
      <canvas
        id="causal-delay-feedback-canvas"
        tabindex="0"
        aria-label="Causal delay feedback replay canvas"
        aria-describedby="causal-delay-feedback-canvas-summary"
      ></canvas>

      <section id="causal-delay-feedback-journey" class="causal-journey" aria-label="Causal delay learning journey">
        <div id="scene-hud-tools" class="causal-app-icon-strip" aria-label="App and lesson navigation">
          <button
            id="textbook-toc-button"
            type="button"
            aria-label="Open textbook table of contents"
            title="Table of Contents"
          >TOC</button>
          <div id="scene-nav-history" class="causal-lesson-nav-history" role="group" aria-label="Lesson sequence">
            <button id="nav-up" class="causal-app-icon-button" type="button" data-guided-action="back" aria-label="Previous lesson" title="Previous lesson">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <polyline points="15 5 8 12 15 19"></polyline>
              </svg>
            </button>
            <button id="nav-forward" class="causal-app-icon-button" type="button" data-guided-action="next" aria-label="Next lesson" title="Next lesson">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <polyline points="9 5 16 12 9 19"></polyline>
              </svg>
            </button>
          </div>
          <button id="home-button" class="causal-app-icon-button" type="button" aria-label="Go to home" title="Home">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M3 11.5L12 4l9 7.5M6.5 10.5V20h11V10.5"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></path>
            </svg>
          </button>
          <div id="scene-search" class="causal-scene-search">
            <button
              id="scene-search-toggle"
              class="causal-app-icon-button causal-scene-search-toggle"
              type="button"
              aria-label="Search scenes"
              aria-controls="scene-search-panel"
              aria-expanded="false"
              title="Search"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="6.5"></circle>
                <line x1="15.5" y1="15.5" x2="21" y2="21"></line>
              </svg>
            </button>
            <div id="scene-search-panel" class="causal-scene-search-panel" aria-hidden="true" inert>
              <input
                id="scene-search-input"
                class="causal-scene-search-input"
                type="search"
                placeholder="Search scenes"
                autocomplete="off"
                aria-label="Search scenes"
              />
              <div id="scene-search-results" class="causal-scene-search-results"></div>
            </div>
          </div>
        </div>
        <nav id="causal-delay-feedback-mode-tabs" class="causal-mode-tabs" aria-label="Lesson table of contents"></nav>
        <section id="causal-delay-feedback-lesson-panel" class="causal-lesson-panel" aria-labelledby="causal-delay-feedback-lesson-title">
          <div id="causal-delay-feedback-lesson-meta" class="causal-lesson-meta"></div>
          <h1 id="causal-delay-feedback-lesson-title">Story</h1>
          <p id="causal-delay-feedback-lesson-body" class="causal-lesson-body"></p>
          <div id="causal-delay-feedback-lesson-content" class="causal-lesson-content"></div>
          <p id="causal-delay-feedback-lesson-status" class="causal-lesson-status" role="status" aria-live="polite"></p>
        </section>
        <p id="causal-delay-feedback-canvas-summary" class="causal-canvas-summary" aria-live="polite"></p>
      </section>

      <div id="causal-delay-feedback-toolbar" class="causal-toolbar" aria-label="Causal delay feedback controls">
        <div class="causal-title">
          <strong>Causal Delay Laboratory</strong>
        </div>

        <div
          id="causal-delay-feedback-visual-switches"
          class="causal-switch-row"
          aria-label="Wake visual switches"
        >
          <button
            class="causal-switch-button"
            type="button"
            data-visual-switch="arcWakesEnabled"
            aria-pressed="true"
            aria-label="Arc wakes"
            title="Arc wakes"
          >Arcs</button>
          <button
            class="causal-switch-button"
            type="button"
            data-visual-switch="fullCircularWakesEnabled"
            aria-pressed="false"
            aria-label="Full circular wakes"
            title="Full circular wakes"
          >Full</button>
        </div>

        <span
          id="causal-delay-feedback-replay-status"
          class="causal-source-chip"
          data-state="representative"
          hidden
        >representative · display only</span>
      </div>

      <div id="causal-delay-feedback-bottom-rail" class="causal-bottom-rail" aria-label="Playback timeline">
        <button id="causal-delay-feedback-guided-first-frame" class="causal-guided-button" type="button" aria-label="First frame"></button>
        <button id="causal-delay-feedback-guided-play" class="causal-guided-button" type="button" aria-pressed="false" aria-keyshortcuts="Space" aria-label="Play"></button>
        <button id="causal-delay-feedback-guided-last-frame" class="causal-guided-button" type="button" aria-label="Last frame"></button>
        <div class="causal-now-scrub">
          <input
            id="causal-delay-feedback-now"
            class="causal-range causal-timeline-range"
            type="range"
            min="0"
            max="1000"
            step="1"
            value="0"
            aria-label="Replay now"
          />
        </div>
      </div>

      <div id="causal-delay-feedback-readout" class="causal-readout" aria-hidden="true" hidden></div>
    </main>

    <script>
      document.addEventListener("keyup", () => {
        document.documentElement.dataset.causalInputModality = "keyboard";
      }, true);
      document.addEventListener("pointerup", () => {
        document.documentElement.dataset.causalInputModality = "pointer";
      }, true);
      document.addEventListener("pointercancel", () => {
        document.documentElement.dataset.causalInputModality = "pointer";
      }, true);
    </script>
    <script type="module" src="./src/apps/causal-delay-feedback/main.js"></script>
  </body>
</html>
