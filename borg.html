<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12130f" />
    <title>Borg</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #12130f;
        color: #f2f5ec;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }

      button,
      input,
      select {
        font: inherit;
      }

      #borg-app {
        display: grid;
        grid-template-columns: 310px minmax(0, 1fr) 342px;
        grid-template-rows: minmax(0, 1fr) 108px;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        background: #12130f;
      }

      .borg-side-rail,
      .borg-timeline {
        border-color: rgba(139, 164, 126, 0.24);
        background: #191b16;
      }

      .borg-side-rail {
        min-width: 0;
        min-height: 0;
        overflow: auto;
        padding: 12px;
      }

      .borg-side-rail.is-left {
        grid-column: 1;
        grid-row: 1 / 3;
        border-right: 1px solid rgba(139, 164, 126, 0.24);
      }

      .borg-side-rail.is-right {
        grid-column: 3;
        grid-row: 1 / 3;
        border-left: 1px solid rgba(139, 164, 126, 0.24);
      }

      .borg-viewport {
        position: relative;
        grid-column: 2;
        grid-row: 1;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: #10120e;
      }

      #borg-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }

      .borg-panel-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
        gap: 10px;
        margin-bottom: 12px;
      }

      .borg-title h1 {
        margin: 0;
        color: #fbfff4;
        font-size: 24px;
        font-weight: 780;
        letter-spacing: 0;
        line-height: 1;
      }

      .borg-title p {
        margin: 5px 0 0;
        color: #abb6a5;
        font-size: 11px;
        font-weight: 700;
      }

      .borg-status-stack {
        display: grid;
        gap: 6px;
        min-width: 0;
        justify-items: stretch;
      }

      .borg-status-chip {
        display: inline-grid;
        align-items: center;
        justify-content: start;
        min-width: 0;
        min-height: 24px;
        max-width: 100%;
        padding: 0 8px;
        border: 1px solid rgba(139, 164, 126, 0.34);
        border-radius: 6px;
        color: #dfe7d6;
        background: #20231d;
        font-size: 11px;
        font-weight: 740;
        line-height: 1.1;
        overflow-wrap: anywhere;
      }

      .borg-status-chip[data-tone="good"] {
        border-color: rgba(139, 209, 124, 0.54);
        color: #c9f5bd;
      }

      .borg-status-chip[data-tone="projection"] {
        border-color: rgba(94, 183, 183, 0.54);
        color: #c2f2f1;
      }

      .borg-status-chip[data-tone="warn"] {
        border-color: rgba(224, 176, 79, 0.62);
        color: #ffdf93;
      }

      .borg-status-chip[data-tone="bad"] {
        border-color: rgba(229, 116, 99, 0.62);
        color: #ffb8ad;
      }

      .borg-section {
        margin: 0 0 14px;
        padding-top: 12px;
        border-top: 1px solid rgba(139, 164, 126, 0.18);
      }

      .borg-section:first-of-type {
        padding-top: 0;
        border-top: 0;
      }

      .borg-provenance-drawer {
        margin: 0;
        padding-top: 12px;
        border-top: 1px solid rgba(139, 164, 126, 0.18);
      }

      .borg-provenance-drawer summary {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        min-height: 30px;
        padding: 5px 7px;
        border: 1px solid rgba(139, 164, 126, 0.18);
        border-radius: 6px;
        background: #1a1d18;
        color: #dfe7d6;
        cursor: pointer;
        font-size: 12px;
        font-weight: 760;
        list-style: none;
      }

      .borg-provenance-drawer summary::-webkit-details-marker {
        display: none;
      }

      .borg-provenance-drawer summary::after {
        content: "+";
        color: #aeb8a6;
        font-size: 14px;
        font-weight: 760;
      }

      .borg-provenance-drawer[open] summary {
        margin-bottom: 8px;
      }

      .borg-provenance-drawer[open] summary::after {
        content: "-";
      }

      .borg-section h2 {
        margin: 0 0 8px;
        color: #f2f5ec;
        font-size: 13px;
        font-weight: 760;
        letter-spacing: 0;
      }

      .borg-field-list {
        display: grid;
        gap: 5px;
      }

      .borg-field-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(88px, auto);
        align-items: center;
        gap: 8px;
        min-height: 28px;
        padding: 5px 7px;
        border: 1px solid rgba(139, 164, 126, 0.16);
        border-radius: 6px;
        background: #20231d;
      }

      .borg-field-label {
        min-width: 0;
        color: #aeb8a6;
        font-size: 11px;
        font-weight: 700;
      }

      .borg-field-value {
        min-width: 0;
        color: #f2f5ec;
        font-size: 11px;
        font-weight: 760;
        line-height: 1.25;
        text-align: right;
      }

      .borg-layer-strip {
        position: absolute;
        left: 14px;
        top: 14px;
        z-index: 3;
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(58px, auto);
        gap: 7px;
        max-width: calc(100% - 28px);
      }

      .borg-layer-button,
      .borg-icon-button {
        display: inline-grid;
        place-items: center;
        height: 32px;
        min-width: 32px;
        padding: 0 8px;
        border: 1px solid rgba(139, 164, 126, 0.3);
        border-radius: 6px;
        background: #20231d;
        color: #dfe7d6;
        cursor: pointer;
      }

      .borg-layer-button {
        font-size: 11px;
        font-weight: 780;
      }

      .borg-layer-button.is-active,
      .borg-icon-button.is-active {
        border-color: rgba(94, 183, 183, 0.74);
        color: #c2f2f1;
        background: #1b2a25;
      }

      .borg-layer-button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }

      .borg-layer-button:hover:not(:disabled),
      .borg-layer-button:focus-visible,
      .borg-icon-button:hover,
      .borg-icon-button:focus-visible {
        border-color: rgba(242, 245, 236, 0.64);
        outline: none;
      }

      .borg-camera-controls {
        position: absolute;
        right: 14px;
        top: 14px;
        z-index: 3;
        display: grid;
        grid-auto-flow: column;
        gap: 7px;
      }

      .borg-icon-button svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.9;
      }

      .borg-selected-tag {
        position: absolute;
        left: 50%;
        bottom: 18px;
        z-index: 3;
        max-width: min(620px, calc(100% - 32px));
        min-height: 30px;
        padding: 7px 10px;
        border: 1px solid rgba(94, 183, 183, 0.42);
        border-radius: 7px;
        background: rgba(25, 27, 22, 0.9);
        color: #eaf6df;
        font-size: 12px;
        font-weight: 760;
        line-height: 1.3;
        transform: translateX(-50%);
      }

      .borg-selected-tag[hidden] {
        display: none;
      }

      .borg-failure-list {
        display: grid;
        gap: 7px;
        padding: 0;
        margin: 0;
        list-style: none;
      }

      .borg-failure-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        min-height: 34px;
        padding: 6px 7px;
        border: 1px solid rgba(229, 116, 99, 0.26);
        border-radius: 6px;
        background: #241d19;
      }

      .borg-failure-code {
        min-width: 0;
        color: #ffd0c9;
        font-size: 11px;
        font-weight: 760;
        line-height: 1.25;
      }

      .borg-timeline {
        grid-column: 2;
        grid-row: 2;
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-columns: 40px 40px 40px minmax(96px, 1fr) 128px 88px minmax(128px, auto);
        gap: 10px;
        align-items: center;
        padding: 12px 14px;
        border-top: 1px solid rgba(139, 164, 126, 0.24);
      }

      .borg-timeline .borg-icon-button {
        width: 40px;
        height: 40px;
      }

      .borg-range {
        appearance: none;
        width: 100%;
        height: 20px;
        background: transparent;
        cursor: pointer;
      }

      .borg-range::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 999px;
        background: #4d5848;
      }

      .borg-range::-webkit-slider-thumb {
        appearance: none;
        width: 16px;
        height: 16px;
        margin-top: -6px;
        border: 2px solid #d9f0d2;
        border-radius: 50%;
        background: #8bd17c;
      }

      .borg-range::-moz-range-track {
        height: 4px;
        border-radius: 999px;
        background: #4d5848;
      }

      .borg-range::-moz-range-progress {
        height: 4px;
        background: #4d5848;
      }

      .borg-range::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border: 2px solid #d9f0d2;
        border-radius: 50%;
        background: #8bd17c;
      }

      .borg-time-output {
        color: #eaf6df;
        font-size: 12px;
        font-weight: 760;
        text-align: right;
      }

      .borg-run-duration-button,
      .borg-playback-speed {
        height: 40px;
        padding: 0 10px;
        border: 1px solid rgba(139, 164, 126, 0.34);
        border-radius: 6px;
        background: #171c16;
        color: #eaf6df;
        font: inherit;
        font-size: 12px;
        font-weight: 760;
      }

      .borg-run-duration-button {
        width: 128px;
        cursor: pointer;
      }

      .borg-eom-controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }

      .borg-eom-controls[hidden] {
        display: none;
      }

      .borg-eom-controls h2 {
        grid-column: 1 / -1;
      }

      .borg-eom-control {
        display: grid;
        gap: 4px;
        color: #abc09f;
        font-size: 10px;
        font-weight: 720;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .borg-eom-control input,
      .borg-eom-action {
        min-width: 0;
        height: 34px;
        border: 1px solid rgba(139, 164, 126, 0.34);
        border-radius: 6px;
        background: #171c16;
        color: #eaf6df;
        font: inherit;
      }

      .borg-eom-control input {
        box-sizing: border-box;
        width: 100%;
        padding: 0 8px;
      }

      .borg-eom-action {
        cursor: pointer;
        font-size: 11px;
        font-weight: 780;
      }

      .borg-eom-action.is-stop {
        border-color: rgba(229, 116, 99, 0.52);
        color: #ffd0c9;
      }

      .borg-eom-progress {
        grid-column: 1 / -1;
        width: 100%;
        accent-color: #8bd17c;
      }

      .borg-eom-progress-label {
        grid-column: 1 / -1;
        color: #c8dbbd;
        font-size: 11px;
        line-height: 1.35;
      }

      .borg-playback-speed {
        width: 88px;
      }

      #borg-boot-error,
      #borg-solver-banner {
        position: absolute;
        left: 16px;
        right: 16px;
        top: 16px;
        z-index: 20;
        padding: 10px 12px;
        border: 1px solid rgba(229, 116, 99, 0.74);
        border-radius: 8px;
        background: #2c1612;
        color: #ffd0c9;
        font-size: 13px;
        font-weight: 760;
      }

      #borg-solver-banner[hidden] {
        display: none;
      }

      #borg-solver-banner .borg-solver-banner-detail {
        margin-top: 4px;
        font-weight: 560;
        font-size: 12px;
        color: #f0bdb3;
      }

      @media (max-width: 980px) {
        html,
        body {
          height: auto;
          min-height: 100%;
          overflow: auto;
        }

        #borg-app {
          grid-template-columns: 1fr;
          grid-template-rows: 360px minmax(420px, 62vh) auto 360px;
          height: auto;
          min-height: 100vh;
          overflow: visible;
        }

        .borg-side-rail.is-left,
        .borg-side-rail.is-right,
        .borg-viewport,
        .borg-timeline {
          grid-column: 1;
        }

        .borg-viewport {
          grid-row: 2;
        }

        .borg-timeline {
          grid-row: 3;
        }

        .borg-side-rail.is-left {
          grid-row: 1;
        }

        .borg-side-rail.is-right {
          grid-row: 4;
        }

        .borg-side-rail.is-left,
        .borg-side-rail.is-right {
          max-height: 360px;
          border: 0;
          border-top: 1px solid rgba(139, 164, 126, 0.24);
        }

        .borg-viewport {
          min-height: 62vh;
        }

        .borg-layer-strip {
          grid-auto-flow: row;
          grid-template-columns: repeat(4, minmax(0, 1fr));
          right: 14px;
        }

        .borg-camera-controls {
          top: auto;
          bottom: 14px;
        }

        .borg-timeline {
          grid-template-columns: 40px 40px 40px minmax(0, 1fr);
        }

        .borg-run-duration-button {
          grid-column: 1 / 3;
          width: 100%;
        }

        .borg-playback-speed {
          grid-column: 3 / 5;
          width: 100%;
        }

        .borg-time-output {
          grid-column: 1 / 5;
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <div id="borg-app">
      <div id="borg-solver-banner" role="status" hidden></div>
      <aside class="borg-side-rail is-left" aria-label="Simulation envelope">
        <header class="borg-panel-header">
          <div class="borg-title">
            <h1>Borg</h1>
            <p>native fixture surface</p>
          </div>
          <div class="borg-status-stack">
            <span id="borg-native-status" class="borg-status-chip">Live compute</span>
            <span id="borg-manifest-status" class="borg-status-chip">Developer test</span>
          </div>
        </header>

        <section id="borg-eom-controls" class="borg-section borg-eom-controls" aria-label="EOM run controls" hidden>
          <h2>EOM Run</h2>
          <label class="borg-eom-control">
            Architrinos
            <input id="borg-eom-path-count" type="number" min="1" max="16" step="1" value="16" inputmode="numeric" />
          </label>
          <label class="borg-eom-control">
            Duration
            <input id="borg-eom-duration" type="number" min="0.01" step="0.01" value="0.01" inputmode="decimal" />
          </label>
          <button id="borg-eom-stop-button" class="borg-eom-action is-stop" type="button">Stop</button>
          <button id="borg-eom-restart-button" class="borg-eom-action" type="button">Restart</button>
          <progress id="borg-eom-progress" class="borg-eom-progress" max="1" value="0"></progress>
          <output id="borg-eom-progress-label" class="borg-eom-progress-label">0 / 1 steps</output>
        </section>

        <section class="borg-section" aria-label="Simulation envelope fields">
          <h2>Simulation Envelope</h2>
          <div id="borg-envelope-fields" class="borg-field-list"></div>
        </section>

        <section class="borg-section" aria-label="Initial condition fields">
          <h2>Initial Condition</h2>
          <div id="borg-initial-condition-fields" class="borg-field-list"></div>
        </section>

        <details class="borg-provenance-drawer" aria-label="Source provenance">
          <summary>Provenance</summary>
          <div id="borg-source-fields" class="borg-field-list"></div>
        </details>
      </aside>

      <main class="borg-viewport" aria-label="Borg simulation viewport">
        <canvas id="borg-canvas" tabindex="0" aria-label="Borg native frame viewport"></canvas>
        <nav id="borg-layer-strip" class="borg-layer-strip" aria-label="Viewport layers"></nav>
        <div class="borg-camera-controls" aria-label="View controls">
          <button id="borg-reset-view-button" class="borg-icon-button" type="button" aria-label="Reset view" title="Reset view">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12l7-6 7 6"></path>
              <path d="M7.5 10.5v7h9v-7"></path>
              <path d="M10 17.5v-4h4v4"></path>
            </svg>
          </button>
          <button id="borg-fit-view-button" class="borg-icon-button" type="button" aria-label="Fit view" title="Fit view">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 9V5h4"></path>
              <path d="M15 5h4v4"></path>
              <path d="M19 15v4h-4"></path>
              <path d="M9 19H5v-4"></path>
            </svg>
          </button>
          <button id="borg-focus-selected-button" class="borg-icon-button" type="button" aria-label="Focus selected" title="Focus selected">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 8v8"></path>
              <path d="M8 12h8"></path>
              <path d="M4 12a8 8 0 1 0 16 0a8 8 0 1 0-16 0"></path>
            </svg>
          </button>
        </div>
        <output id="borg-selected-tag" class="borg-selected-tag" hidden></output>
      </main>

      <aside class="borg-side-rail is-right" aria-label="Diagnostics">
        <section class="borg-section" aria-label="Diagnostics summary">
          <h2>Diagnostics</h2>
          <div id="borg-diagnostics-fields" class="borg-field-list"></div>
        </section>

        <section class="borg-section" aria-label="Fail closed rows">
          <h2>Fail Closed</h2>
          <ul id="borg-fail-closed-list" class="borg-failure-list"></ul>
        </section>

        <section class="borg-section" aria-label="Value authority">
          <h2>Value Authority</h2>
          <div id="borg-authority-fields" class="borg-field-list"></div>
        </section>

        <section class="borg-section" aria-label="Render manifest">
          <h2>Render Manifest</h2>
          <div id="borg-render-fields" class="borg-field-list"></div>
        </section>

        <section class="borg-section" aria-label="Deployment budget">
          <h2>Deployment Budget</h2>
          <div id="borg-deployment-fields" class="borg-field-list"></div>
        </section>
      </aside>

      <section class="borg-timeline" aria-label="Timeline">
        <button id="borg-play-button" class="borg-icon-button" type="button" aria-label="Play" title="Play">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z"></path>
          </svg>
        </button>
        <button id="borg-start-frame-button" class="borg-icon-button" type="button" aria-label="First frame" title="First frame">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 5v14"></path>
            <path d="M18 6l-8 6 8 6z"></path>
          </svg>
        </button>
        <button id="borg-new-distribution-button" class="borg-icon-button" type="button" aria-label="New distribution" title="New distribution">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h3.5c1.5 0 2.6.7 3.4 2.1l2.2 3.8c.8 1.4 1.9 2.1 3.4 2.1H20"></path>
            <path d="M17 12l3 3-3 3"></path>
            <path d="M4 17h3.5c1.5 0 2.6-.7 3.4-2.1l2.2-3.8c.8-1.4 1.9-2.1 3.4-2.1H20"></path>
            <path d="M17 6l3 3-3 3"></path>
          </svg>
        </button>
        <input id="borg-time-range" class="borg-range" type="range" min="0" max="2" step="1" value="2" aria-label="Keyframe" title="Buffered-frame scrubber; a Forever run has no finite completion percentage." />
        <button id="borg-run-duration-button" class="borg-run-duration-button" type="button" aria-label="Run duration: Forever" title="Toggle run duration">Forever</button>
        <select id="borg-playback-speed" class="borg-playback-speed" aria-label="Playback speed"></select>
        <output id="borg-time-output" class="borg-time-output">solver t 2 | keyframe 2</output>
      </section>
    </div>
    <script type="module" src="./src/apps/borg/main.js"></script>
  </body>
</html>
