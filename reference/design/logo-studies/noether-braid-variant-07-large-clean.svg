    <linearGradient id="p120" gradientUnits="userSpaceOnUse" x1="858.41" y1="712" x2="165.59" y2="312"><stop offset="0" stop-color="#ff0000"/><stop offset=".56" stop-color="#a00052"/><stop offset="1" stop-color="#4b0082"/></linearGradient>
