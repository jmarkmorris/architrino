<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Noether Braid best-effort 3D ribbon logo study</title>
  <desc id="desc">A vector logo study for the Noether Braid concept, preserving the three-ellipse grammar and red positrino / blue electrino convention while using ribbon highlights, shadows, and glossy architrinos to make the braid structure more legible.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="44%" r="72%">
      <stop offset="0" stop-color="#5f1299"/>
      <stop offset=".62" stop-color="#4b0082"/>
      <stop offset="1" stop-color="#24003f"/>
    </radialGradient>

    <linearGradient id="red-ribbon" x1="760" y1="870" x2="230" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7474"/>
      <stop offset=".24" stop-color="#ff0000"/>
      <stop offset=".68" stop-color="#e00021"/>
      <stop offset="1" stop-color="#85001e"/>
    </linearGradient>
    <linearGradient id="blue-ribbon" x1="820" y1="140" x2="220" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8aa2ff"/>
      <stop offset=".24" stop-color="#1133ff"/>
      <stop offset=".68" stop-color="#0000ff"/>
      <stop offset="1" stop-color="#05007f"/>
    </linearGradient>
    <linearGradient id="red-highlight" x1="760" y1="780" x2="300" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd0d0" stop-opacity=".9"/>
      <stop offset=".52" stop-color="#ff7c7c" stop-opacity=".44"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="blue-highlight" x1="760" y1="120" x2="260" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dce5ff" stop-opacity=".9"/>
      <stop offset=".52" stop-color="#6d8cff" stop-opacity=".44"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".1"/>
    </linearGradient>

    <radialGradient id="red-ball" cx="35%" cy="28%" r="72%">
      <stop offset="0" stop-color="#ffc1c1"/>
      <stop offset=".22" stop-color="#ff3232"/>
      <stop offset=".66" stop-color="#ff0000"/>
      <stop offset="1" stop-color="#86001a"/>
    </radialGradient>
    <radialGradient id="blue-ball" cx="35%" cy="28%" r="72%">
      <stop offset="0" stop-color="#d8e2ff"/>
      <stop offset=".22" stop-color="#3156ff"/>
      <stop offset=".66" stop-color="#0000ff"/>
      <stop offset="1" stop-color="#050082"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#150021" flood-opacity=".58"/>
    </filter>
    <filter id="ball-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#13001f" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#background)"/>

  <!-- Soft shared cast shadow: the braid sits above the purple field. -->
  <g fill="none" stroke="#170027" stroke-width="94" stroke-linecap="round" stroke-linejoin="round" opacity=".42" filter="url(#shadow)">
    <path d="M512 112 A146 400 0 0 0 512 912"/>
    <path d="M512 912 A146 400 0 0 0 512 112"/>
    <path d="M512 112 A146 400 0 0 0 512 912" transform="rotate(120 512 512)"/>
    <path d="M512 912 A146 400 0 0 0 512 112" transform="rotate(120 512 512)"/>
    <path d="M512 112 A146 400 0 0 0 512 912" transform="rotate(240 512 512)"/>
    <path d="M512 912 A146 400 0 0 0 512 112" transform="rotate(240 512 512)"/>
  </g>

  <!-- Main ribbon bodies. Ordering is deliberately mixed to suggest over-under weaving. -->
  <g fill="none" stroke-width="72" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M512 112 A146 400 0 0 0 512 912" stroke="url(#red-ribbon)"/>
    <path d="M512 912 A146 400 0 0 0 512 112" transform="rotate(120 512 512)" stroke="url(#blue-ribbon)"/>
    <path d="M512 112 A146 400 0 0 0 512 912" transform="rotate(240 512 512)" stroke="url(#red-ribbon)"/>
    <path d="M512 912 A146 400 0 0 0 512 112" stroke="url(#blue-ribbon)"/>
    <path d="M512 112 A146 400 0 0 0 512 912" transform="rotate(120 512 512)" stroke="url(#red-ribbon)"/>
    <path d="M512 912 A146 400 0 0 0 512 112" transform="rotate(240 512 512)" stroke="url(#blue-ribbon)"/>
  </g>

  <!-- Gloss lines ride on the same geometry; they add depth without changing the flat orbit grammar. -->
  <g fill="none" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity=".72">
    <path d="M512 112 A146 400 0 0 0 512 912" stroke="url(#red-highlight)"/>
    <path d="M512 112 A146 400 0 0 0 512 912" transform="rotate(120 512 512)" stroke="url(#red-highlight)"/>
    <path d="M512 112 A146 400 0 0 0 512 912" transform="rotate(240 512 512)" stroke="url(#red-highlight)"/>
    <path d="M512 912 A146 400 0 0 0 512 112" stroke="url(#blue-highlight)"/>
    <path d="M512 912 A146 400 0 0 0 512 112" transform="rotate(120 512 512)" stroke="url(#blue-highlight)"/>
    <path d="M512 912 A146 400 0 0 0 512 112" transform="rotate(240 512 512)" stroke="url(#blue-highlight)"/>
  </g>

  <g filter="url(#ball-shadow)">
    <circle cx="512" cy="112" r="66" fill="url(#red-ball)"/>
    <circle cx="858.41" cy="712" r="66" fill="url(#red-ball)"/>
    <circle cx="165.59" cy="712" r="66" fill="url(#red-ball)"/>
    <circle cx="512" cy="912" r="66" fill="url(#blue-ball)"/>
    <circle cx="165.59" cy="312" r="66" fill="url(#blue-ball)"/>
    <circle cx="858.41" cy="312" r="66" fill="url(#blue-ball)"/>
  </g>

  <g fill="#ffffff" opacity=".46">
    <circle cx="489" cy="91" r="14"/>
    <circle cx="835" cy="691" r="14"/>
    <circle cx="143" cy="691" r="14"/>
    <circle cx="489" cy="891" r="14"/>
    <circle cx="143" cy="291" r="14"/>
    <circle cx="835" cy="291" r="14"/>
  </g>
</svg>
